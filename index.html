    /* ============================================================
       SOUND — สังเคราะห์เสียงสัตว์ด้วย Web Audio API
       ============================================================ */

    let audioCtx = null;
    const getAudioContext = () => {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      if (!audioCtx) audioCtx = new Ctor();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    };

    const playSynthesizedSound = (type) => {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'dog') {
          const playBark = (offset) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now + offset);
            osc.frequency.exponentialRampToValueAtTime(320, now + offset + 0.05);
            osc.frequency.exponentialRampToValueAtTime(80, now + offset + 0.12);
            gain.gain.setValueAtTime(0.4, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.12);
            osc.start(now + offset);
            osc.stop(now + offset + 0.13);
          };
          playBark(0); playBark(0.18);

        } else if (type === 'cat') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sawtooth';
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(900, now);
          filter.Q.value = 4;
          // เสียง "เมี้ยว" — ไล่ขึ้นเร็วแล้วลากเสียงลง
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
          osc.frequency.exponentialRampToValueAtTime(430, now + 0.55);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.3, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.62);

        } else if (type === 'duck') {
          const playQuack = (offset) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
            osc.type = 'square';
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, now + offset);
            filter.Q.value = 8;
            osc.frequency.setValueAtTime(420, now + offset);
            osc.frequency.exponentialRampToValueAtTime(180, now + offset + 0.16);
            gain.gain.setValueAtTime(0.28, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.17);
            osc.start(now + offset);
            osc.stop(now + offset + 0.18);
          };
          playQuack(0); playQuack(0.22);

        } else if (type === 'chime') {
          // เสียงกริ๊งจบ Focus Time
          [880, 1320, 1760].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.16);
            gain.gain.setValueAtTime(0.001, now + i * 0.16);
            gain.gain.exponentialRampToValueAtTime(0.25, now + i * 0.16 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.5);
            osc.start(now + i * 0.16);
            osc.stop(now + i * 0.16 + 0.52);
          });
        }
      } catch (err) {
        // เสียงเล่นไม่ได้ ไม่ควรทำให้ทั้งแอปพัง
        console.warn('playSynthesizedSound failed:', err);
      }
    };

    const toISO = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;

    const fromISO = (s) => {
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);

    function useAuth() {
      const [uid, setUid] = useState(null);

      useEffect(() => {
        const unsub = auth.onAuthStateChanged((user) => {
          if (user) setUid(user.uid);
        });
        auth.signInAnonymously().catch((e) => {
          setError(e.code === 'auth/operation-not-allowed'
            ? 'ยังไม่ได้เปิด Anonymous sign-in ใน Firebase Console'
            : e.message);
        });
        return unsub;
      }, []);

      return { uid, error };
    }

    /* ============================================================
       useRoom — sync ทุกอย่างผ่าน Firestore (เก็บถาวร ไม่หายเมื่อออกห้อง)

       โครงข้อมูล:
         rooms/{room}/members/{uid}   presence + แต้มของแต่ละคน
         rooms/{room}/tasks/{id}      กระดานงานร่วม
         rooms/{room}/messages/{id}   แชท
         rooms/{room}/meta/state      ธีมของห้อง
         rooms/{room}/events/{id}     ทัก/โฟกัส (ของชั่วคราว มีอายุ EVENT_TTL_MS)
       ============================================================ */

    function useRoom({ room, me, ready, onEvent }) {
      const [status, setStatus] = useState('connecting'); // connecting | online | offline
      const [allMembers, setAllMembers] = useState({});
      const [tasks, setTasks] = useState([]);
      const [messages, setMessages] = useState([]);
      const [roomTheme, setRoomTheme] = useState(null);

      const meRef = useRef(me);
      const onEventRef = useRef(onEvent);
      meRef.current = me;
      onEventRef.current = onEvent;

      const roomRef = useMemo(
        () => (room && ready ? db.collection('rooms').doc(room) : null),
        [room, ready]
      );

      /* ---------- ฟังทุก collection ---------- */
      useEffect(() => {
        if (!roomRef) return;
        const fail = (label) => (err) => {
          console.error('Firestore listener failed (' + label + '):', err);
          setStatus('offline');
        };
        const unsubs = [];

        unsubs.push(roomRef.collection('members').onSnapshot((snap) => {
          const next = {};
          snap.forEach((d) => { next[d.id] = { id: d.id, ...d.data() }; });
          setAllMembers(next);
          setStatus('online');
        }, fail('members')));

        unsubs.push(roomRef.collection('tasks').orderBy('ts').limit(500).onSnapshot((snap) => {
          setTasks(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        }, fail('tasks')));

        unsubs.push(roomRef.collection('messages').orderBy('ts', 'desc').limit(100).onSnapshot((snap) => {
          setMessages(snap.docs.map((d) => ({ id: d.id, ...d.data() })).reverse());
        }, fail('messages')));

        unsubs.push(roomRef.collection('meta').doc('state').onSnapshot((d) => {
          const data = d.data();
          if (data && data.themeId) setRoomTheme(data.themeId);
        }, fail('meta')));

        // รับเฉพาะ event ที่เกิดหลังเราเข้าห้อง ไม่งั้นจะได้ยินเสียงทักย้อนหลังทั้งกอง
        const since = Date.now();
        unsubs.push(roomRef.collection('events').where('ts', '>', since).onSnapshot((snap) => {
          snap.docChanges().forEach((ch) => {
            if (ch.type !== 'added') return;
            const ev = ch.doc.data();
            if (!ev.from || ev.from.id === meRef.current.id) return; // ข้าม echo ของตัวเอง
            onEventRef.current(ev);
          });
        }, fail('events')));

        return () => unsubs.forEach((u) => u());
      }, [roomRef]);

      /* ---------- เขียน presence + เต้นหัวใจ ---------- */
      useEffect(() => {
        if (!roomRef || !me.id) return;
        const doc = roomRef.collection('members').doc(me.id);
        const write = () => {
          doc.set({
            name: me.name,
            pet: me.pet,
            mood: me.mood || null,
            points: me.points || 0,
            focusUntil: me.focusUntil || null,
            lastSeen: Date.now()
          }, { merge: true }).catch((e) => console.warn('presence write failed:', e));
        };
        write();
        const beat = setInterval(write, HEARTBEAT_MS);
        const bye = () => { doc.delete().catch(() => {}); };
        window.addEventListener('beforeunload', bye);
        return () => {
          clearInterval(beat);
          window.removeEventListener('beforeunload', bye);
        };
      }, [roomRef, me.id, me.name, me.pet, me.mood, me.points, me.focusUntil]);

      /* ---------- เก็บกวาด event เก่า (best-effort) ---------- */
      useEffect(() => {
        if (!roomRef) return;
        const sweep = () => {
          roomRef.collection('events').where('ts', '<', Date.now() - EVENT_TTL_MS).limit(20).get()
            .then((snap) => snap.forEach((d) => d.ref.delete().catch(() => {})))
            .catch(() => {});
        };
        const t = setInterval(sweep, EVENT_TTL_MS);
        sweep();
        return () => clearInterval(t);
      }, [roomRef]);

      /* ---------- actions ---------- */
      const emit = useCallback((type, payload) => {
        if (!roomRef) return;
        const { id, name, pet } = meRef.current;
        roomRef.collection('events').add({
          type, payload: payload || null, ts: Date.now(), from: { id, name, pet }
        }).catch((e) => console.warn('emit failed:', e));
      }, [roomRef]);

      const api = useMemo(() => ({
        addTask: (task) => roomRef && roomRef.collection('tasks').doc(task.id).set(task),
        updateTask: (id, patch) => roomRef && roomRef.collection('tasks').doc(id).update(patch),
        deleteTask: (id) => roomRef && roomRef.collection('tasks').doc(id).delete(),
        sendChat: (msg) => roomRef && roomRef.collection('messages').doc(msg.id).set(msg),
        setTheme: (themeId) => roomRef && roomRef.collection('meta').doc('state').set({ themeId, ts: Date.now() }),
        removeMe: (id) => roomRef && roomRef.collection('members').doc(id).delete()
      }), [roomRef]);

      return { status, allMembers, tasks, messages, roomTheme, emit, api };
    }

    function WorkloadPanel({ me, members, tasks }) {
      const roster = useMemo(() => {
        const list = Object.values(members);
        list.sort((a, b) => a.name.localeCompare(b.name, 'th'));
        return [me, ...list];
      }, [me, members]);

      const activeCount = (id) => tasks.filter((t) => !t.done && t.ownerId === id).length;

      return (
        <Panel
          title="งานในมือของแต่ละคน"
          emoji="📊"
          badge="เรียลไทม์"
          badgeClass="bg-emerald-100 text-emerald-700"
        >
          <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
            {roster.map((m) => {
              const pet = PETS_CONFIG[m.pet] || PETS_CONFIG.dog;
              const n = activeCount(m.id);
              const free = clamp(1 - n / WORKLOAD_CAPACITY, 0, 1) * 100;
              const busy = n >= WORKLOAD_CAPACITY;
              return (
                <div key={m.id} className={'rounded-xl border p-2.5 animate-scaleUp ' +
                  (m.id === me.id ? 'border-slate-300 bg-slate-50' : 'border-slate-200 bg-white')}>

                      <span className="text-[9px] rounded-full bg-indigo-100 text-indigo-700 px-1.5 py-0.5 shrink-0">🕐 โฟกัส</span>
                    )}
                    <span className={'ml-auto text-[11px] shrink-0 ' + (busy ? 'text-rose-600 font-medium' : 'text-slate-500')}>
                      {n === 0 ? '👍 ว่างงาน' : 'ทำอยู่ ' + n + ' งาน'}
                    </span>
                  </div>
                  <div className="mt-1.5 h-1.5 rounded-full bg-slate-200 overflow-hidden">
                    <div
                      className={'h-full rounded-full transition-all duration-500 ' +
                        (free > 60 ? 'bg-emerald-500' : free > 20 ? 'bg-amber-500' : 'bg-rose-500')}
                      style={{ width: free + '%' }}

                    <div className={'mt-2 text-[10px] rounded-lg border px-2 py-1 ' + pet.bubbleColor}>
                      {m.mood.emoji} {m.mood.text}

      );
    }

              >
                {roster.map((m) => (
                  <option key={m.id} value={m.id}>
                    {(PETS_CONFIG[m.pet] || PETS_CONFIG.dog).emoji} {m.name}{m.id === me.id ? ' (คุณ)' : ''}
                  </option>
                ))}
              </select>

            <div>
              <label className="block text-[11px] text-slate-500 mb-1">แต้มที่ได้เมื่อปิดงาน</label>
              <div className="flex gap-1.5">
                {[5, 10, 20, 50].map((p) => (
                  <button

                    key={p}

                    +{p}

              เพิ่มงานเข้าปฏิทิน 🐾

    /* ============================================================
       กลาง: ปฏิทินสัปดาห์
       ============================================================ */

    function WeekStrip({ theme, anchor, selected, tasks, onSelect, onShift }) {
      const start = startOfWeek(fromISO(anchor));
      const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
      const today = toISO(new Date());

      return (
        <div className="flex items-stretch gap-2">
          <button
            onClick={() => onShift(-7)}
            className="shrink-0 rounded-xl bg-white/95 hover:bg-white px-3 text-xs font-medium text-slate-600 shadow-md transition-colors"
          >
            ◀ เลื่อนกลับ
          </button>

          <div className="flex-1 grid grid-cols-7 gap-1.5 sm:gap-2">
            {days.map((d) => {
              const iso = toISO(d);
              const active = iso === selected;
              const n = tasks.filter((t) => t.date === iso && !t.done).length;
              return (
                <button
                  key={iso}
                  onClick={() => onSelect(iso)}
                  className={'relative rounded-xl py-2.5 shadow-md transition-all ' + (active
                    ? theme.primaryButton + ' text-white scale-105 font-bold'
                    : 'bg-white/95 text-slate-600 hover:bg-white hover:scale-[1.03]')}
                >
                  <div className="text-[10px] sm:text-[11px] opacity-80">{THAI_DAYS[d.getDay()]}</div>
                  <div className="text-lg sm:text-2xl font-black leading-tight">{d.getDate()}</div>
                  {iso === today && (
                    <div className={'text-[8px] ' + (active ? 'text-white/80' : 'text-emerald-600 font-medium')}>วันนี้</div>
                  )}
                  {n > 0 && (
                    <span className={'absolute top-1 right-1 text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold ' +
                      (active ? 'bg-white/30 text-white' : 'bg-rose-500 text-white')}>
                      {n}
                    </span>
                  )}
                </button>
              );
            })}
          </div>

          <button
            onClick={() => onShift(7)}
            className="shrink-0 rounded-xl bg-white/95 hover:bg-white px-3 text-xs font-medium text-slate-600 shadow-md transition-colors"
          >
            เลื่อนต่อ ▶
          </button>
        </div>
      );
    }

    /* ============================================================
       กลาง: ปฏิทินทั้งเดือน (modal)
       ============================================================ */

    function MonthModal({ theme, anchor, selected, tasks, onSelect, onClose }) {
      const [cursor, setCursor] = useState(() => {
        const d = fromISO(anchor);
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });

      const firstDay = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
      const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
      const lead = firstDay.getDay();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push(null);
      for (let i = 1; i <= daysInMonth; i++) cells.push(new Date(cursor.getFullYear(), cursor.getMonth(), i));
      const today = toISO(new Date());

      const shiftMonth = (n) => setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + n, 1));

      return (
        <div
          className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={onClose}
        >
          <div
            className="w-full max-w-2xl rounded-2xl bg-white p-5 shadow-2xl animate-scaleUp"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center gap-3 mb-4">
              <button onClick={() => shiftMonth(-1)} className="rounded-lg bg-slate-100 hover:bg-slate-200 px-3 py-1.5 text-sm transition-colors">◀</button>
              <h2 className="flex-1 text-center font-bold text-slate-700">
                {THAI_MONTHS[cursor.getMonth()]} {cursor.getFullYear()}
              </h2>
              <button onClick={() => shiftMonth(1)} className="rounded-lg bg-slate-100 hover:bg-slate-200 px-3 py-1.5 text-sm transition-colors">▶</button>
              <button onClick={onClose} className="rounded-lg bg-slate-100 hover:bg-slate-200 px-3 py-1.5 text-sm transition-colors">✕</button>
            </div>

            <div className="grid grid-cols-7 gap-1 mb-1">
              {THAI_DAYS_SHORT.map((d) => (
                <div key={d} className="text-center text-[11px] font-medium text-slate-400 py-1">{d}</div>
              ))}
            </div>

            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                if (!d) return <div key={'empty' + i}></div>;
                const iso = toISO(d);
                const active = iso === selected;
                const open = tasks.filter((t) => t.date === iso && !t.done).length;
                const done = tasks.filter((t) => t.date === iso && t.done).length;
                return (
                  <button
                    key={iso}
                    onClick={() => { onSelect(iso); onClose(); }}
                    className={'relative aspect-square rounded-xl text-sm transition-all flex flex-col items-center justify-center ' +
                      (active ? theme.primaryButton + ' text-white font-bold scale-105'
                        : iso === today ? 'bg-emerald-50 text-emerald-700 font-semibold hover:bg-emerald-100'
                        : 'bg-slate-50 text-slate-600 hover:bg-slate-100')}
                  >
                    <span>{d.getDate()}</span>
                    {(open > 0 || done > 0) && (
                      <span className="flex gap-0.5 mt-0.5">
                        {open > 0 && <span className={'w-1.5 h-1.5 rounded-full ' + (active ? 'bg-white' : 'bg-rose-500')}></span>}
                        {done > 0 && <span className={'w-1.5 h-1.5 rounded-full ' + (active ? 'bg-white/60' : 'bg-emerald-500')}></span>}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>

            <div className="flex items-center justify-center gap-4 mt-4 text-[11px] text-slate-400">
              <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span> มีงานค้าง</span>
              <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> มีงานที่เสร็จแล้ว</span>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       กลาง: รายการงานประจำวัน

                        (t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-slate-500')}

                    <button

                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </Panel>
      );
    }

    /* ============================================================
       ขวา: คลังไฟล์และลิงก์ของวันนี้

    function LinkVaultPanel({ date, messages }) {
      const links = useMemo(() => {
        const out = [];

          extractLinks(m.text).forEach((url) => {
            out.push({ url, name: m.name, pet: m.pet, ts: m.ts, id: m.id + url });
          });
        });
        return out;
      }, [date, messages]);

      return (
        <Panel
          title="คลังไฟล์และลิงก์ของวันนี้"
          emoji="🗃"
          badge="ดึงข้อมูลอัตโนมัติจากแชท 🔄"
          badgeClass="bg-emerald-100 text-emerald-700"

          {links.length === 0 ? (
            <EmptyState
              emoji="🔗"
              title="ยังไม่มีรูปภาพ คลิป หรือลิงก์ที่แชร์ของวันนี้"
              hint="💡 ลองพิมพ์ลิงก์ในแชทโดยปักหมุดวันที่นี้ดูสิ!"

          ) : (
            <div className="space-y-2 max-h-56 overflow-y-auto pr-1">

                <a
                  key={l.id}
                  href={l.url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="block rounded-xl border border-amber-200 bg-amber-50 p-2.5 hover:bg-amber-100 transition-colors animate-scaleUp"
                >
                  <div className="text-[10px] text-amber-700 flex items-center gap-1">

                    {shortUrl(l.url)}

                </a>
              ))}
            </div>
          )}
        </Panel>
      );
    }

    /* ============================================================
       ขวา: แชทอัปเดตกลุ่ม
       ============================================================ */

    function ChatPanel({ theme, me, messages, pinDate, onSend }) {
      const [text, setText] = useState('');
      const endRef = useRef(null);

      useEffect(() => {
        if (endRef.current) endRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, [messages.length]);

      const submit = (e) => {
        e.preventDefault();
        const t = text.trim();
        if (!t) return;
        onSend(t);
        setText('');
      };

      return (
        <Panel title="แชทอัปเดตกลุ่ม" emoji="🐾" badge={'📌 ' + pinDate} badgeClass="bg-rose-100 text-rose-600">
          <div className="space-y-3 max-h-[26rem] overflow-y-auto pr-1">
            {messages.length === 0 && (
              <EmptyState emoji="💬" title="ยังไม่มีใครพูดอะไร" hint="เริ่มทักก่อนเลย!" />
            )}
            {messages.map((m) => {
              const pet = PETS_CONFIG[m.pet] || PETS_CONFIG.dog;
              const links = extractLinks(m.text);
              return (
                <div key={m.id} className="animate-scaleUp">
                  <div className="flex items-center gap-1.5 flex-wrap mb-1">
                    <span className="text-base">{pet.emoji}</span>
                    <span className="text-[11px] font-semibold text-slate-600">{m.name}</span>
                    <span className="text-[10px] text-slate-400">({pet.name})</span>
                    {m.pinDate && (
                      <span className="text-[9px] rounded-full bg-rose-50 text-rose-500 px-1.5 py-0.5">
                        📌 ปักหมุดวันที่ {m.pinDate}
                      </span>
                    )}
                    <span className="text-[9px] text-slate-300 ml-auto">{timeLabel(m.ts)}</span>
                  </div>

                  <div className={'rounded-2xl border px-3 py-2 text-xs break-words ' +
                    (m.fromId === me.id ? 'bg-slate-100 border-slate-200 text-slate-700' : pet.bubbleColor)}>
                    {m.text}
                  </div>

                  {links.map((url) => (
                    <a
                      key={url}
                      href={url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="mt-1 block rounded-xl border border-amber-200 bg-amber-50 px-2.5 py-1.5 hover:bg-amber-100 transition-colors"
                    >
                      <div className="text-[9px] text-amber-700">🔗 แชร์ลิงก์ด่วน</div>
                      <div className="text-[11px] text-amber-900 underline break-all">{shortUrl(url)}</div>
                    </a>
                  ))}
                </div>

            })}
            <div ref={endRef}></div>

          <form onSubmit={submit} className="mt-3 flex gap-1.5">
            <input
              value={text}
              onChange={(e) => setText(e.target.value)}
              maxLength={200}
              placeholder="พิมพ์ข้อความหรือวางลิงก์..."
              className="flex-1 min-w-0 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-slate-300 placeholder:text-slate-400"
            />
            <button
              type="submit"
              disabled={!text.trim()}
              className={'shrink-0 rounded-xl px-3.5 py-2 text-xs font-semibold text-white disabled:opacity-40 transition-colors focus:outline-none focus:ring-2 ' + theme.primaryButton}
            >
              ส่ง
            </button>
          </form>
          <p className="text-[10px] text-slate-400 mt-1.5">ข้อความจะถูกปักหมุดที่วันที่ {pinDate} และลิงก์จะเข้าคลังอัตโนมัติ</p>
        </Panel>
      );
    }

    /* ============================================================
       ปุ่มลอย: Focus Time
       ============================================================ */

    function FocusButton({ theme, focusUntil, onStart, onStop }) {
      const [now, setNow] = useState(Date.now());

      useEffect(() => {
        if (!focusUntil) return;
        const t = setInterval(() => setNow(Date.now()), 500);
        return () => clearInterval(t);
      }, [focusUntil]);

      const running = focusUntil && focusUntil > now;
      const left = running ? Math.max(0, focusUntil - now) : 0;
      const mm = String(Math.floor(left / 60000)).padStart(2, '0');
      const ss = String(Math.floor((left % 60000) / 1000)).padStart(2, '0');

      return (
        <button
          onClick={running ? onStop : onStart}
          className={'fixed bottom-5 right-5 z-40 rounded-full px-6 py-3.5 font-bold text-white shadow-2xl transition-all hover:scale-105 active:scale-95 flex items-center gap-2 ' +
            (running ? 'bg-gradient-to-r from-rose-500 to-red-600' : theme.primaryButton)}
        >
          <span className={running ? 'animate-pulse' : ''}>🕐</span>
          {running
            ? <span>โฟกัสอยู่ {mm}:{ss} — กดเพื่อหยุด</span>
            : <span>Focus Time ({FOCUS_MINUTES} นาที)</span>}
        </button>
      );
    }

    /* ============================================================
       APP
       ============================================================ */

    function App() {
      const { uid: authUid, error: authError } = useAuth();

      const [session, setSession] = useState(() => readStore('pawmate.session', null));
      const [me, setMe] = useState(() => {
        const saved = readStore('pawmate.session', null);
        return {
          id: null,                       // ได้จาก Firebase anonymous auth
          name: saved ? saved.name : '',
          pet: saved ? saved.pet : 'dog',
          mood: null,
          points: readStore('pawmate.points', 0),
          focusUntil: null
        };
      });

      // uid จาก auth คือตัวตนของเรา และเป็น doc id ใน rooms/{room}/members
      useEffect(() => {
        if (authUid) setMe((prev) => (prev.id === authUid ? prev : { ...prev, id: authUid }));
      }, [authUid]);

      const [themeId, setThemeId] = useState('purple');
      const [toasts, setToasts] = useState([]);

      const [selectedDate, setSelectedDate] = useState(() => toISO(new Date()));
      const [weekAnchor, setWeekAnchor] = useState(() => toISO(new Date()));
      const [category, setCategory] = useState('marketing');
      const [selectedTaskId, setSelectedTaskId] = useState(null);
      const [showMonth, setShowMonth] = useState(false);

      const [fullness, setFullness] = useState(() => readStore('pawmate.fullness', 70));
      const [petMsg, setPetMsg] = useState('');
      const [lastPoke, setLastPoke] = useState(() => Date.now());
      const [tick, setTick] = useState(0);   // เดินเวลาให้สัตว์เลี้ยงหลับ + ตัดคนที่หายไปเอง

      const theme = THEMES_CONFIG[themeId] || THEMES_CONFIG.purple;

      const toast = useCallback((text) => {
        const id = uid();
        setToasts((prev) => [...prev.slice(-3), { id, text }]);
        setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3500);
      }, []);

      // เขียนลง Firestore ไม่สำเร็จต้องรู้ตัว ไม่ใช่เงียบหาย
      const guard = useCallback((p, what) => {
        if (p && p.catch) p.catch((e) => {
          console.error(what + ' failed:', e);
          toast('บันทึกไม่สำเร็จ (' + what + ') — ' + (e.code || e.message));
        });
      }, [toast]);

      /* ---------- event ชั่วคราว: ทัก / โฟกัส / เข้า-ออกห้อง ----------
         งาน แชท ธีม สมาชิก ไม่ต้องมาทางนี้แล้ว — Firestore snapshot ส่งให้เอง */
      const handleEvent = useCallback((ev) => {
        const { type, payload, from } = ev;
        switch (type) {
          case 'hello':
            toast(from.name + ' เข้าบ้านมาแล้ว ' + (PETS_CONFIG[from.pet] || PETS_CONFIG.dog).emoji);
            break;
          case 'bye':
            toast(from.name + ' ออกจากบ้านไปแล้ว 👋');
            break;
          case 'poke': {
            const pet = PETS_CONFIG[payload.pet] || PETS_CONFIG.dog;
            playSynthesizedSound(pet.sound);
            toast(from.name + ' ' + payload.action + ' ' + pet.emoji);
            break;
          }
          case 'theme':
            if (THEMES_CONFIG[payload.id]) {
              toast(from.name + ' เปลี่ยนธีมเป็น ' + THEMES_CONFIG[payload.id].name);
            }
            break;
          case 'focus':
            toast(payload.on
              ? from.name + ' เข้าโหมด Focus Time — อย่าเพิ่งกวนนะ 🕐'
              : from.name + ' ออกจากโหมดโฟกัสแล้ว ✨');
            break;
          default:
            break;
        }
      }, [toast]);

      const { status, allMembers, tasks, messages, roomTheme, emit, api } = useRoom({
        room: session ? session.room : null,
        me,
        ready: !!authUid,
        onEvent: handleEvent
      });

      // ธีมของห้องมาจาก Firestore — ใครเปลี่ยนก็เปลี่ยนพร้อมกันทุกเครื่อง
      useEffect(() => {
        if (roomTheme && THEMES_CONFIG[roomTheme]) setThemeId(roomTheme);
      }, [roomTheme]);

      /* ---------- สมาชิกคนอื่นที่ยังไม่หายไป ----------
         Firestore ไม่มี onDisconnect เหมือน RTDB ถ้าใครปิดแท็บดื้อ ๆ doc จะค้าง
         เลยกรองด้วย lastSeen เอง (tick ทำให้คำนวณใหม่ทุก 5 วิ) */
      const members = useMemo(() => {
        const cutoff = Date.now() - MEMBER_TIMEOUT_MS;
        const out = {};
        Object.values(allMembers).forEach((m) => {
          if (m.id !== me.id && (m.lastSeen || 0) >= cutoff) out[m.id] = m;
        });
        return out;
      }, [allMembers, me.id, tick]);

      /* ---------- เก็บค่าไว้ในเครื่อง ---------- */
      useEffect(() => { writeStore('pawmate.points', me.points); }, [me.points]);
      useEffect(() => { writeStore('pawmate.fullness', fullness); }, [fullness]);

      /* ---------- สัตว์เลี้ยงหิวลงเรื่อย ๆ ---------- */
      useEffect(() => {
        const t = setInterval(() => setFullness((f) => clamp(f - 1, 0, 100)), 15000);
        return () => clearInterval(t);
      }, []);

      /* ---------- นาฬิกาเดินทุก 5 วิ ให้สถานะหลับ/ตื่นอัปเดตเอง ---------- */
      useEffect(() => {
        const t = setInterval(() => setTick((n) => n + 1), 5000);
        return () => clearInterval(t);
      }, []);

      /* ---------- Focus Time หมดเวลา ---------- */
      useEffect(() => {
        if (!me.focusUntil) return;
        const left = me.focusUntil - Date.now();
        if (left <= 0) return;
        const t = setTimeout(() => {
          playSynthesizedSound('chime');
          toast('หมดเวลาโฟกัสแล้ว! พักสายตาหน่อยนะ 🎉');
          setMe((prev) => ({ ...prev, focusUntil: null }));
          emit('focus', { on: false });
        }, left);
        return () => clearTimeout(t);
      }, [me.focusUntil, toast, emit]);

      // อ้าง tick เพื่อให้ค่านี้คำนวณใหม่ทุก 5 วิ ไม่ใช่รอ state อื่นเปลี่ยน
      const sleeping = tick >= 0 && !me.focusUntil && Date.now() - lastPoke > 45000;

      /* ---------- ข้อมูลที่คำนวณ ---------- */
      const houseTotal = useMemo(() => {
        return [me, ...Object.values(members)].reduce((sum, m) => sum + (m.points || 0), 0);
      }, [me, members]);
      const houseLevel = Math.floor(houseTotal / HOUSE_EXP_PER_LEVEL) + 1;
      const houseExp = houseTotal % HOUSE_EXP_PER_LEVEL;

      const selectedTask = useMemo(
        () => tasks.find((t) => t.id === selectedTaskId) || null,
        [tasks, selectedTaskId]
      );

      /* ---------- actions ---------- */
      const join = (data) => {
        const s = { name: data.name, pet: data.pet, room: data.room };
        writeStore('pawmate.session', s);
        setMe((prev) => ({ ...prev, name: data.name, pet: data.pet }));
        setSession(s);
        setTimeout(() => emit('hello', null), 800);   // รอให้ listener ติดก่อนค่อยทัก
      };

      const leave = () => {
        emit('bye', null);
        if (me.id) api.removeMe(me.id);
        localStorage.removeItem('pawmate.session');
        setSession(null);
      };

      const renameMe = (name) => {
        setMe((prev) => ({ ...prev, name }));   // presence effect เขียนลง Firestore ให้เอง
        const s = { ...session, name };
        writeStore('pawmate.session', s);
        setSession(s);
      };

      const setMood = (mood) => setMe((prev) => ({ ...prev, mood }));

      const addTask = ({ text, category, date, points, ownerId, ownerName }) => {
        const task = {
          id: uid(), text, category, date, points, done: false,
          byId: me.id, byName: me.name, ownerId, ownerName,
          doneById: null, doneByName: null, ts: Date.now()
        };
        guard(api.addTask(task), 'เพิ่มงาน');
        setSelectedTaskId(task.id);
        setSelectedDate(date);
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
      };

      const toggleTask = (task) => {
        const done = !task.done;
        guard(api.updateTask(task.id, {
          done,
          doneById: done ? me.id : null,
          doneByName: done ? me.name : null
        }), 'ปิดงาน');

        // แต้มเป็นของคนที่กดปิดงาน — คืนแต้มถ้าคนเดิมกดเปิดใหม่
        if (done) {
          setMe((prev) => ({ ...prev, points: (prev.points || 0) + task.points }));
          playSynthesizedSound(PETS_CONFIG[me.pet].sound);
          toast('เก่งมาก! +' + task.points + ' แต้ม 🎉');
          setPetMsg('เย้! ปิดงานได้อีกชิ้น เก่งที่สุดเลย! 🎉');
          setLastPoke(Date.now());
        } else if (task.doneById === me.id) {
          setMe((prev) => ({ ...prev, points: Math.max(0, (prev.points || 0) - task.points) }));
        }
      };

      const deleteTask = (task) => {
        guard(api.deleteTask(task.id), 'ลบงาน');
        if (selectedTaskId === task.id) setSelectedTaskId(null);
      };

      const sendChat = (text) => {
        guard(api.sendChat({
          id: uid(), text, pinDate: selectedDate,
          fromId: me.id, name: me.name, pet: me.pet, ts: Date.now()
        }), 'ส่งข้อความ');
      };

      const changeTheme = (id) => {
        setThemeId(id);
        guard(api.setTheme(id), 'เปลี่ยนธีม');
        emit('theme', { id });
      };

      const wakePet = () => {
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
        setLastPoke(Date.now());
        setPetMsg(sleeping
          ? 'หวัดดี! ตื่นแล้ววว ตัวเบาโหวงเลย ✨'
          : IDLE_LINES[Math.floor(Math.random() * IDLE_LINES.length)]);
        emit('poke', { action: 'ปลุกสัตว์เลี้ยงของตัวเอง', pet: me.pet });
      };

      const feedPet = () => {
        const food = DEFAULT_FOODS[Math.floor(Math.random() * DEFAULT_FOODS.length)];
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
        setFullness((f) => clamp(f + 20, 0, 100));
        setLastPoke(Date.now());
        setPetMsg('อร่อยจัง! ' + food.emoji + ' ' + food.name + ' อิ่มขึ้นอีก 20% แล้ว');
        emit('poke', { action: 'ป้อน ' + food.name + ' ให้', pet: me.pet });
      };

      const pinchPet = () => {
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
        setLastPoke(Date.now());
        setPetMsg('โอ๊ย! เจ็บนะ 😾 หยิกแรงไปแล้ววว');
        emit('poke', { action: 'หยิกแก้ม', pet: me.pet });
      };

      const startFocus = () => {
        const until = Date.now() + FOCUS_MINUTES * 60000;
        setMe((prev) => ({ ...prev, focusUntil: until }));
        setLastPoke(Date.now());
        setPetMsg('โหมดโฟกัส! เดี๋ยวเฝ้าให้ ห้ามใครกวน 🔕');
        emit('focus', { on: true });
      };

      const stopFocus = () => {
        setMe((prev) => ({ ...prev, focusUntil: null }));
        emit('focus', { on: false });
      };

      /* ---------- ข้อความสัตว์เลี้ยงตามสถานะ ---------- */
      useEffect(() => {
        if (!petMsg) return;
        const t = setTimeout(() => setPetMsg(''), 6000);
        return () => clearTimeout(t);
      }, [petMsg]);

      const petLine = petMsg
        || (sleeping ? 'ฟี้... Zzz... 😴 (หลับปุ๋ย... คลิกที่ตัวเค้าเพื่อปลุกสิ)' : '')
        || (fullness < 25 ? 'ท้องร้องแล้วนะ... 🥺 ขออาหารหน่อยได้ไหม' : '');

      /* ---------- render ---------- */
      if (authError) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-rose-900 to-red-950 text-white flex items-center justify-center p-6">
            <div className="max-w-md text-center">
              <div className="text-6xl mb-4">🙀</div>
              <h1 className="text-xl font-black mb-2">เชื่อมต่อ Firebase ไม่ได้</h1>
              <p className="text-sm text-white/70 mb-4">{authError}</p>
              <div className="rounded-xl bg-white/10 border border-white/20 p-4 text-left text-xs leading-relaxed">
                เปิด Firebase Console → <b>Authentication</b> → <b>Sign-in method</b> → เปิด <b>Anonymous</b><br />
                แล้วรีเฟรชหน้านี้อีกครั้ง
              </div>
            </div>
          </div>
        );
      }

      if (!authUid) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-800 to-fuchsia-900 text-white flex flex-col items-center justify-center p-6">
            <span className="text-6xl animate-bounce-slow">🐶</span>
            <p className="mt-4 text-sm text-white/70">กำลังเชื่อม Firebase...</p>
          </div>
        );
      }

      if (!session) {
        return <JoinScreen onJoin={join} initial={{ name: me.name, pet: me.pet, room: '' }} />;
      }

      return (
        <div className={'min-h-screen pb-24 ' + theme.bgClass}>
          <Header
            theme={theme}
            me={me}
            houseLevel={houseLevel}
            houseExp={houseExp}
            status={status}
            room={session.room}
            memberCount={Object.keys(members).length + 1}
            onName={renameMe}
            onMood={setMood}
            onTheme={changeTheme}
            onLeave={leave}
          />

          <div className="max-w-[1800px] mx-auto px-3 py-4 grid gap-4 grid-cols-1 lg:grid-cols-[280px_minmax(0,1fr)] xl:grid-cols-[280px_minmax(0,1fr)_340px]">

            {/* ---------- ซ้าย ---------- */}
            <div className="space-y-4 animate-fadeIn">
              <WorkloadPanel me={me} members={members} tasks={tasks} />
              <CategoryPanel theme={theme} tasks={tasks} selected={category} onSelect={setCategory} />
              <CreateTaskPanel
                theme={theme}
                category={category}
                date={selectedDate}
                me={me}
                members={members}
                onAdd={addTask}
              />
            </div>

            {/* ---------- กลาง ---------- */}
            <div className="space-y-4 animate-fadeIn">
              <div className="flex items-end justify-between gap-3 flex-wrap">
                <div>
                  <h2 className="text-xl font-black flex items-center gap-2">
                    <span>🗓</span> แผงควบคุมและปฏิทินของทีม
                  </h2>
                  <p className="text-xs opacity-60 mt-0.5">เลือกดูหัวข้องานของแต่ละวันอย่างเป็นระบบ</p>
                </div>
                <button
                  onClick={() => setShowMonth(true)}
                  className={'rounded-xl px-4 py-2.5 text-sm font-semibold text-white shadow-lg transition-colors focus:outline-none focus:ring-2 ' + theme.primaryButton}
                >
                  📝 ดูปฏิทินทั้งเดือน
                </button>
              </div>

              <WeekStrip
                theme={theme}
                anchor={weekAnchor}
                selected={selectedDate}
                tasks={tasks}
                onSelect={setSelectedDate}
                onShift={(n) => {
                  const next = toISO(addDays(fromISO(weekAnchor), n));
                  setWeekAnchor(next);
                  setSelectedDate(next);
                }}
              />

              <DayTaskList
                theme={theme}
                date={selectedDate}
                tasks={tasks}
                me={me}
                selectedTaskId={selectedTaskId}
                onPick={setSelectedTaskId}
                onToggle={toggleTask}
                onDelete={deleteTask}
              />

              <PetYard
                theme={theme}
                me={me}
                fullness={fullness}
                sleeping={sleeping}
                message={petLine}
                onWake={wakePet}
                onFeed={feedPet}
                onPinch={pinchPet}
              />
            </div>

            {/* ---------- ขวา ---------- */}
            <div className="space-y-4 animate-fadeIn">
              <TaskDetailPanel theme={theme} task={selectedTask} onToggle={toggleTask} />
              <LinkVaultPanel date={selectedDate} messages={messages} />
              <ChatPanel theme={theme} me={me} messages={messages} pinDate={selectedDate} onSend={sendChat} />
            </div>
          </div>

          {showMonth && (
            <MonthModal
              theme={theme}
              anchor={weekAnchor}
              selected={selectedDate}
              tasks={tasks}
              onSelect={(iso) => { setSelectedDate(iso); setWeekAnchor(iso); }}
              onClose={() => setShowMonth(false)}
            />
          )}

          <FocusButton theme={theme} focusUntil={me.focusUntil} onStart={startFocus} onStop={stopFocus} />
          <Toasts toasts={toasts} />

          <footer className="max-w-[1800px] mx-auto px-4 pb-4 text-center">
            <p className="text-[10px] opacity-40">
              ข้อมูลเก็บถาวรใน Firebase Firestore · ความเป็นส่วนตัวอยู่ที่รหัสห้อง — อย่าใส่ข้อมูลลับ
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
