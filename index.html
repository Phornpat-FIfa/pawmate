<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawmate - Realtime Teamwork Workspace & Gamification App</title>

  <!-- Tailwind CSS (JIT ในบราวเซอร์) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Families (Mitr & Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Mitr:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase (compat build — ให้ global `firebase` ใช้กับ Babel standalone ในไฟล์เดียวได้)
       ข้อมูลทั้งหมด sync + เก็บถาวรผ่าน Firestore -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Mitr', 'Inter', sans-serif;
    }

    /* ช่องกรอกทุกชนิดต้องเป็นตัวหนังสือสีดำเสมอ ไม่งั้นสืบทอดสีขาวจากธีมแล้วมองไม่เห็น
       ต้องใช้ !important เพราะ preflight ของ Tailwind ตั้ง `color: inherit` ให้ form element
       และมันถูกฉีดเข้า <head> ตอนรันไทม์ = มาทีหลัง style นี้ = ชนะด้วย document order */
    input, select, textarea, option {
      color: #0f172a !important;
      font-family: inherit;
    }
    input::placeholder, textarea::placeholder {
      color: #94a3b8 !important;
      opacity: 1;
    }
    /* ปฏิทินของ input[type=date] บน Safari/Chrome ใช้สีจาก color-scheme */
    input[type="date"] {
      color-scheme: light;
    }

    /* Smooth transition animations for panels and buttons */
    .animate-fadeIn {
      animation: fadeIn 0.4s ease-out forwards;
    }
    .animate-scaleUp {
      animation: scaleUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .animate-wiggle {
      animation: wiggle 0.5s ease-in-out infinite;
    }
    .animate-bounce-slow {
      animation: bounce 2s infinite;
    }
    .animate-roam {
      animation: roam 7s ease-in-out infinite;
    }
    .animate-zzz {
      animation: zzz 2.5s ease-out infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes roam {
      0% { transform: translate(-15px, 0); }
      25% { transform: translate(-15px, -6px); }
      50% { transform: translate(15px, 0); }
      75% { transform: translate(15px, -6px); }
      100% { transform: translate(-15px, 0); }
    }
    @keyframes dragonFly {
      0% { transform: translateX(110vw); }
      100% { transform: translateX(-40vw); }
    }
    .animate-dragon-fly { animation: dragonFly 26s linear infinite; }
    @keyframes dragonHover {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }
    .animate-dragon-hover { animation: dragonHover 4s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .animate-twinkle { animation: twinkle 3s ease-in-out infinite; }
    @keyframes meteor {
      0% { transform: translate(0, 0); opacity: 0; }
      2% { opacity: 1; }
      7% { transform: translate(-22vw, 16vh); opacity: 0; }
      100% { transform: translate(-22vw, 16vh); opacity: 0; }
    }
    .animate-meteor { animation: meteor 7s linear infinite; }
    @keyframes wingFlap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.35); }
    }
    .animate-wing { animation: wingFlap 0.8s ease-in-out infinite; }
    @keyframes flameFlicker {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.8); }
    }
    .animate-flame { animation: flameFlicker 0.5s ease-in-out infinite; transform-origin: right center; }
    @keyframes knightIdle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .animate-knight { animation: knightIdle 2.4s ease-in-out infinite; }
    @keyframes zzz {
      0% { opacity: 0; transform: translate(0, 0) scale(0.7); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(18px, -34px) scale(1.25); }
    }

    /* ธีมสายไหม — เด้งหยุ่นสนุกสนานแบบลูกโป่ง/ลูกอม */
    @keyframes candyBounce {
      0%, 100% { transform: translateY(0) rotate(-6deg) scale(1, 1); }
      8% { transform: translateY(0) rotate(-6deg) scale(1.07, 0.93); }
      25% { transform: translateY(-6px) rotate(-3deg) scale(0.94, 1.07); }
      45% { transform: translateY(-22px) rotate(3deg) scale(1, 1); }
      70% { transform: translateY(-6px) rotate(-3deg) scale(0.97, 1.03); }
      82% { transform: translateY(0) rotate(-6deg) scale(1.07, 0.93); }
      92% { transform: translateY(0) rotate(-6deg) scale(0.98, 1.02); }
    }
    .animate-candy-bounce { animation: candyBounce 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes candyShadow {
      0%, 100% { transform: scaleX(1); opacity: 0.35; }
      8%, 82% { transform: scaleX(1.1); opacity: 0.4; }
      45% { transform: scaleX(0.6); opacity: 0.15; }
    }
    .animate-candy-shadow { animation: candyShadow 1.6s ease-in-out infinite; }
    @keyframes sprinkleFall {
      0% { transform: translateY(-8vh) rotate(var(--r)); }
      100% { transform: translateY(108vh) rotate(calc(var(--r) + 360deg)); }
    }
    .animate-sprinkle-fall { animation: sprinkleFall 12s linear infinite; }
    @keyframes balloonSway {
      0%, 100% { transform: rotate(-5deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(-6px); }
    }
    .animate-balloon-sway { animation: balloonSway 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes bubblePop {
      0%, 100% { transform: scale(1); }
      6% { transform: scale(1.07); }
      12% { transform: scale(0.97); }
      18% { transform: scale(1); }
    }
    .animate-bubble-pop { animation: bubblePop 3s ease-in-out infinite; transform-origin: 0% 100%; }

    /* ธีมยูนิคอร์น — ล่องลอยนุ่มนวล สง่างามแบบมนตร์เสน่ห์ */
    @keyframes unicornFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-unicorn-float { animation: unicornFloat 6s ease-in-out infinite; }
    @keyframes shimmer {
      0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(90deg); }
    }
    .animate-shimmer { animation: shimmer 4.5s ease-in-out infinite; }
    @keyframes hornGlint {
      0%, 60%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
      75% { opacity: 1; transform: scale(1.15) rotate(45deg); }
    }
    .animate-horn-glint { animation: hornGlint 2.8s ease-in-out infinite; }
    @keyframes cloudDrift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-cloud-drift { animation: cloudDrift 60s linear infinite; }
    @keyframes rainbowBreathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.8; }
    }
    .animate-rainbow-breathe { animation: rainbowBreathe 8s ease-in-out infinite; }

    /* ธีมเทพเจ้ากรีก — สง่างาม ช้า มั่นคง เปล่งประกายทอง */
    @keyframes sunburstSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-sunburst-spin { animation: sunburstSpin 120s linear infinite; }
    @keyframes haloPulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .animate-halo-pulse { animation: haloPulse 6s ease-in-out infinite; }
    @keyframes goldGleam {
      0% { background-position: 100% 0; }
      45%, 100% { background-position: 0% 0; }
    }
    .animate-gold-gleam { animation: goldGleam 7s ease-in-out infinite; }
    @keyframes boltFlash {
      0%, 84%, 100% { opacity: 0; }
      86% { opacity: 1; }
      88% { opacity: 0.25; }
      90% { opacity: 1; }
      95% { opacity: 0; }
    }
    .animate-bolt-flash { animation: boltFlash 6s linear infinite; }
    @keyframes moteDrift {
      0%, 100% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(var(--dx), -26px); opacity: 1; }
    }
    .animate-mote-drift { animation: moteDrift 7s ease-in-out infinite; }
    @keyframes leafFall {
      0% { transform: translate(0, -10vh) rotate(0deg); }
      25% { transform: translate(34px, 18vh) rotate(70deg); }
      50% { transform: translate(-12px, 48vh) rotate(-20deg); }
      75% { transform: translate(28px, 78vh) rotate(80deg); }
      100% { transform: translate(0, 110vh) rotate(20deg); }
    }
    .animate-leaf-fall { animation: leafFall 20s linear infinite; }

    /* ธีมเทพเจ้ากรีก (รอบแก้) — พายุทองเหนือโอลิมปัส ทุกอย่างซิงก์รอบ 6 วินาที ฟ้าผ่าที่ 35% และ 85% */
    @keyframes cloudRoll {
      from { background-position: 0 0; }
      to { background-position: -640px 0; }
    }
    .animate-cloud-roll { animation: cloudRoll 80s linear infinite; }
    @keyframes boltStrike {
      0%, 84%, 100% { opacity: 0; }
      85% { opacity: 1; }
      87.5% { opacity: 0.3; }
      89% { opacity: 1; }
      94% { opacity: 0; }
    }
    @keyframes boltDraw {
      0%, 84% { stroke-dashoffset: 1; }
      86.5%, 100% { stroke-dashoffset: 0; }
    }
    .animate-bolt-strike { opacity: 0; animation: boltStrike 6s linear infinite; }
    .animate-bolt-strike path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: boltDraw 6s linear infinite; animation-delay: var(--d, 0s); }
    @keyframes stormFlash {
      0%, 35%, 44%, 85%, 94%, 100% { opacity: 0; }
      35.8% { opacity: 1; }
      37.5% { opacity: 0.2; }
      39% { opacity: 0.85; }
      85.8% { opacity: 1; }
      87.5% { opacity: 0.2; }
      89% { opacity: 0.85; }
    }
    .animate-storm-flash { opacity: 0; animation: stormFlash 6s linear infinite; }
    @keyframes sparkFlicker {
      0%, 22%, 100% { opacity: 0; }
      4% { opacity: 1; }
      8% { opacity: 0.15; }
      12% { opacity: 1; }
    }
    .animate-spark-flicker { opacity: 0; animation: sparkFlicker 2.6s steps(1, end) infinite; }
    @keyframes zeusShadow {
      0%, 100% { transform: scaleX(1); opacity: 0.55; }
      50% { transform: scaleX(0.78); opacity: 0.28; }
    }
    .animate-zeus-shadow { animation: zeusShadow 5s ease-in-out infinite; }

    /* ธีมมหาสมุทรลึก (รอบแก้) — มืด ช้า ลึกลับ มีแสงเรืองจากสิ่งมีชีวิต */
    @keyframes squidDrift {
      0% { transform: translate(110vw, 0) rotate(-2deg); }
      50% { transform: translate(40vw, -30px) rotate(2deg); }
      100% { transform: translate(calc(-100% - 10vw), 0) rotate(-2deg); }
    }
    .animate-squid-drift { animation: squidDrift 80s linear infinite; }
    @keyframes snowSink {
      0% { transform: translate(0, -5vh); opacity: 0; }
      10% { opacity: 0.8; }
      50% { transform: translate(var(--dx), 50vh); }
      90% { opacity: 0.6; }
      100% { transform: translate(0, 105vh); opacity: 0; }
    }
    .animate-snow-sink { animation: snowSink 28s linear infinite; }
    @keyframes eyeBlink {
      0%, 30%, 70%, 100% { opacity: 0; transform: scaleY(1); }
      36%, 50%, 54%, 64% { opacity: 1; transform: scaleY(1); }
      52% { opacity: 1; transform: scaleY(0.1); }
    }
    .animate-eye-blink { animation: eyeBlink 16s ease-in-out infinite; }
    @keyframes lurePulse {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      45% { opacity: 1; transform: scale(1.1); }
      55% { opacity: 0.8; transform: scale(1); }
    }
    .animate-lure-pulse { animation: lurePulse 3.2s ease-in-out infinite; }
    @keyframes abyssLurk {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      35% { transform: translate(16px, -6px) rotate(-1.5deg); }
      70% { transform: translate(4px, 8px) rotate(1deg); }
    }
    .animate-abyss-lurk { animation: abyssLurk 11s ease-in-out infinite; }
    @keyframes jellyPulse {
      0%, 100% { transform: scale(1, 1); }
      35% { transform: scale(1.14, 0.84); }
      60% { transform: scale(0.95, 1.06); }
    }
    .animate-jelly-pulse { animation: jellyPulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes abyssGlow {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    .animate-abyss-glow { animation: abyssGlow 4.5s ease-in-out infinite; }

    /* ธีมมหาสมุทร — ลื่นไหล ลอยตัว ขึ้นลงตามคลื่น */
    @keyframes raySway {
      0%, 100% { transform: rotate(calc(var(--a) - 3deg)); opacity: 0.5; }
      50% { transform: rotate(calc(var(--a) + 3deg)); opacity: 1; }
    }
    .animate-ray-sway { animation: raySway 9s ease-in-out infinite; transform-origin: 50% 0%; }
    @keyframes bubbleRise {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      8% { opacity: 0.95; }
      30% { transform: translate(var(--dx), -32vh) scale(0.85); }
      55% { transform: translate(calc(var(--dx) * -1), -62vh) scale(1); }
      80% { transform: translate(var(--dx), -90vh) scale(1.05); opacity: 0.9; }
      100% { transform: translate(0, -118vh) scale(1.1); opacity: 0; }
    }
    .animate-bubble-rise { animation: bubbleRise 12s ease-in-out infinite; }
    @keyframes fishSwim {
      0% { transform: translate(-30vw, 0); }
      25% { transform: translate(10vw, -14px); }
      50% { transform: translate(50vw, 0); }
      75% { transform: translate(90vw, 12px); }
      100% { transform: translate(130vw, 0); }
    }
    .animate-fish-swim { animation: fishSwim 40s linear infinite; }
    @keyframes kelpSway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    .animate-kelp-sway { animation: kelpSway 5s ease-in-out infinite; transform-origin: 50% 100%; }

    @media (prefers-reduced-motion: reduce) {
      .animate-candy-bounce, .animate-candy-shadow, .animate-sprinkle-fall, .animate-balloon-sway,
      .animate-bubble-pop, .animate-unicorn-float, .animate-shimmer, .animate-horn-glint,
      .animate-cloud-drift, .animate-rainbow-breathe,
      .animate-sunburst-spin, .animate-halo-pulse, .animate-gold-gleam, .animate-bolt-flash,
      .animate-mote-drift, .animate-leaf-fall, .animate-ray-sway,
      .animate-bubble-rise, .animate-fish-swim, .animate-kelp-sway,
      .animate-cloud-roll, .animate-zeus-shadow, .animate-lure-pulse, .animate-abyss-lurk,
      .animate-jelly-pulse, .animate-abyss-glow {
        animation: none;
      }
      .animate-sprinkle-fall, .animate-leaf-fall, .animate-bubble-rise, .animate-fish-swim,
      .animate-bolt-strike, .animate-storm-flash, .animate-spark-flicker,
      .animate-squid-drift, .animate-snow-sink, .animate-eye-blink {
        display: none;
      }
    }

    /* Scrollbar customization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.03);
      border-radius: 12px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.12);
      border-radius: 12px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0,0,0,0.25);
    }
  </style>

  <!-- React 18, React DOM and Babel Standalone for live JSX transpilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 antialiased overflow-x-hidden selection:bg-indigo-100">

  <div id="root" class="min-h-screen flex flex-col justify-between">
    <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
      <span class="text-7xl animate-bounce-slow">🏡🐶🐱</span>
      <h1 class="text-2xl font-black text-indigo-700 mt-5">Pawmate กำลังเตรียมเปิดบ้าน...</h1>
      <p class="text-xs text-slate-400 mt-2">บราวเซอร์กำลังประมวลผลสคริปต์ React, Tailwind และเครื่องมือจำลองสื่อการทำงานเรียลไทม์</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* ============================================================
       CONFIG
       ============================================================ */

    const PETS_CONFIG = {

        activeTabClass: 'bg-cyan-900/80 text-white border-l-4 border-cyan-400 shadow-sm',
        accentText: 'text-cyan-200',

        illustrationText: '🦆🌊 ชวนกันเล่นน้ำคลายร้อนริมหาดทรายขาว! 🐨🏊‍♂️'

      if (audioCtx.state === 'suspended') audioCtx.resume();

    const playSynthesizedSound = (type) => {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'dog') {
          const playBark = (offset) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now + offset);
            osc.frequency.exponentialRampToValueAtTime(320, now + offset + 0.05);
            osc.frequency.exponentialRampToValueAtTime(80, now + offset + 0.12);
            gain.gain.setValueAtTime(0.4, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.12);
            osc.start(now + offset);
            osc.stop(now + offset + 0.13);
          };

            osc.frequency.setValueAtTime(freq, now + i * 0.16);

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(1046, now + offset);
            gain.gain.setValueAtTime(0.001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.22, now + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.22);
            osc.start(now + offset);
            osc.stop(now + offset + 0.24);
          };
          playBeep(0); playBeep(0.3);
        }
      } catch (err) {
        // เสียงเล่นไม่ได้ ไม่ควรทำให้ทั้งแอปพัง
        console.warn('playSynthesizedSound failed:', err);
      }
    };

    /* ============================================================
       HELPERS
       ============================================================ */

    const uid = () => Math.random().toString(36).slice(2, 10);

    const readStore = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);

      }
    };

    const writeStore = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* โควตาเต็ม — ข้ามไป */ }
    };

    const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

    // สุ่มแบบคงที่จาก id ของแต่ละตัว — กันไม่ให้แอนิเมชันเดินสุ่มใหม่ทุกครั้งที่ re-render
    // (ถ้าใช้ Math.random() ตรง ๆ จังหวะเดินจะกระตุกทุกครั้งที่ presence อัปเดต)
    function seededRange(str, min, max) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return min + (h % (max - min + 1));
    }

    const timeLabel = (ts) => {

    // วันที่แบบ local (ไม่ใช่ UTC) เพื่อไม่ให้วันเพี้ยนข้ามเขตเวลา
    const toISO = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    };
    const fromISO = (s) => {
      const [y, m, d] = s.split('-').map(Number);

    const addDays = (date, n) => {
      const d = new Date(date);
      d.setDate(d.getDate() + n);

    const URL_RE = /(https?:\/\/[^\s]+)/g;
    const extractLinks = (text) => (text || '').match(URL_RE) || [];
    const shortUrl = (u) => u.replace(/^https?:\/\//, '').slice(0, 34) + (u.length > 42 ? '...' : '');

    /* ============================================================
       รูปภาพ — ย่อในเบราว์เซอร์แล้วเก็บเป็น base64 ลง Firestore

       ทำแบบนี้เพราะ Firebase Storage ต้องอัปแพลน Blaze (ผูกบัตร)
       ส่วน Firestore ฟรีแต่จำกัด 1 document ไว้ที่ 1MB
       เลยต้องย่อให้เหลือ < IMAGE_MAX_BYTES ก่อนเสมอ
       ============================================================ */

    const IMAGE_MAX_DIM = 900;       // ด้านที่ยาวที่สุดของรูป (px)
    const IMAGE_MAX_BYTES = 600000;  // ความยาว data URL — เผื่อที่ให้ field อื่นในเอกสาร

    const compressImage = (file) => new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);

      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, IMAGE_MAX_DIM / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        // รูป PNG โปร่งใสจะกลายเป็นดำถ้าไม่รองพื้นขาวก่อนแปลงเป็น JPEG
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        let quality = 0.72;
        let out = canvas.toDataURL('image/jpeg', quality);
        while (out.length > IMAGE_MAX_BYTES && quality > 0.3) {
          quality -= 0.12;
          out = canvas.toDataURL('image/jpeg', quality);
        }
        if (out.length > IMAGE_MAX_BYTES) {
          reject(new Error('รูปนี้ใหญ่เกินไป ย่อจนสุดแล้วยังไม่พอดี ลองครอปให้เล็กลงก่อน'));
        } else {
          resolve(out);
        }
      };

      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('เปิดไฟล์รูปนี้ไม่ได้ ไฟล์อาจเสียหรือไม่ใช่รูปภาพ'));
      };

      img.src = url;
    });

    /* ============================================================
       useAuth — ล็อกอินแบบ anonymous เพื่อให้ผ่าน security rules
       ============================================================ */

    function useAuth() {
      const [uid, setUid] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        const unsub = auth.onAuthStateChanged((user) => {
          if (user) setUid(user.uid);
        });
        auth.signInAnonymously().catch((e) => {
          setError(e.code === 'auth/operation-not-allowed'
            ? 'ยังไม่ได้เปิด Anonymous sign-in ใน Firebase Console'
            : e.message);
        });
        return unsub;
      }, []);

      return { uid, error };
    }

    /* ============================================================
       useRoom — sync ทุกอย่างผ่าน Firestore (เก็บถาวร ไม่หายเมื่อออกห้อง)

       โครงข้อมูล:
         rooms/{room}/members/{uid}   presence + แต้มของแต่ละคน
         rooms/{room}/tasks/{id}      กระดานงานร่วม
         rooms/{room}/messages/{id}   แชท
         rooms/{room}/meta/state      ธีมของห้อง
         rooms/{room}/events/{id}     ทัก/โฟกัส (ของชั่วคราว มีอายุ EVENT_TTL_MS)
       ============================================================ */

    function useRoom({ room, me, ready, onEvent }) {
      const [status, setStatus] = useState('connecting'); // connecting | online | offline
      const [allMembers, setAllMembers] = useState({});
      const [tasks, setTasks] = useState([]);
      const [messages, setMessages] = useState([]);
      const [roomTheme, setRoomTheme] = useState(null);
      const [roomCategories, setRoomCategories] = useState(null); // null = ยังไม่มีใน Firestore, ให้ใช้ DEFAULT_CATEGORIES
      // EXP ของบ้าน — เก็บเป็นยอดสะสมถาวรของห้อง ไม่ผูกกับผลรวมแต้มของสมาชิกที่ออนไลน์อยู่ตอนนี้
      // (ถ้าผูกกับ presence สด ๆ พอมีคนออกจากห้อง/ปิดแท็บ แต้มของคนนั้นจะหายไปจากยอดรวมทันที)
      const [houseTotal, setHouseTotal] = useState(0);

      const meRef = useRef(me);
      const onEventRef = useRef(onEvent);
      meRef.current = me;
      onEventRef.current = onEvent;

      const roomRef = useMemo(
        () => (room && ready ? db.collection('rooms').doc(room) : null),
        [room, ready]
      );

      /* ---------- ฟังทุก collection ---------- */
      useEffect(() => {
        if (!roomRef) return;
        const fail = (label) => (err) => {
          console.error('Firestore listener failed (' + label + '):', err);
          setStatus('offline');
        };
        const unsubs = [];

        unsubs.push(roomRef.collection('members').onSnapshot((snap) => {
          const next = {};
          snap.forEach((d) => { next[d.id] = { id: d.id, ...d.data() }; });
          setAllMembers(next);
          setStatus('online');
        }, fail('members')));

        unsubs.push(roomRef.collection('tasks').orderBy('ts').limit(500).onSnapshot((snap) => {
          setTasks(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        }, fail('tasks')));

        unsubs.push(roomRef.collection('messages').orderBy('ts', 'desc').limit(100).onSnapshot((snap) => {
          setMessages(snap.docs.map((d) => ({ id: d.id, ...d.data() })).reverse());
        }, fail('messages')));

        unsubs.push(roomRef.collection('meta').doc('state').onSnapshot((d) => {
          const data = d.data();
          if (data && data.themeId) setRoomTheme(data.themeId);
        }, fail('meta')));

        unsubs.push(roomRef.collection('meta').doc('categories').onSnapshot((d) => {
          const data = d.data();
          setRoomCategories(data && Array.isArray(data.list) ? data.list : null);
        }, fail('meta')));

        unsubs.push(roomRef.collection('meta').doc('house').onSnapshot((d) => {
          const data = d.data();
          setHouseTotal(data && typeof data.total === 'number' ? data.total : 0);
        }, fail('meta')));

        // รับเฉพาะ event ที่เกิดหลังเราเข้าห้อง ไม่งั้นจะได้ยินเสียงทักย้อนหลังทั้งกอง
        const since = Date.now();
        unsubs.push(roomRef.collection('events').where('ts', '>', since).onSnapshot((snap) => {
          snap.docChanges().forEach((ch) => {
            if (ch.type !== 'added') return;
            const ev = ch.doc.data();
            if (!ev.from || ev.from.id === meRef.current.id) return; // ข้าม echo ของตัวเอง
            onEventRef.current(ev);
          });
        }, fail('events')));

        return () => unsubs.forEach((u) => u());
      }, [roomRef]);

      /* ---------- เขียน presence + เต้นหัวใจ ----------
         อ่านค่าจาก meRef เสมอ เพื่อให้ heartbeat หยิบค่าล่าสุดไปโดยไม่ต้องผูก effect
         deps มีเฉพาะค่าที่ "เปลี่ยนแล้วคนอื่นควรเห็นทันที" — fullness ไม่อยู่ในนั้น
         เพราะมันลดลงเองทุก 15 วิ ถ้าใส่จะกลายเป็น write ทุก 15 วิ กินโควตาฟรี */
      useEffect(() => {
        if (!roomRef || !me.id) return;
        const doc = roomRef.collection('members').doc(me.id);
        const write = () => {
          const m = meRef.current;
          doc.set({
            name: m.name,
            pet: m.pet,
            mood: m.mood || null,
            points: m.points || 0,
            focusUntil: m.focusUntil || null,
            fullness: typeof m.fullness === 'number' ? m.fullness : 100,
            sleeping: !!m.sleeping,
            lastSeen: Date.now()
          }, { merge: true }).catch((e) => console.warn('presence write failed:', e));
        };
        write();
        const beat = setInterval(write, HEARTBEAT_MS);
        const bye = () => { doc.delete().catch(() => {}); };
        window.addEventListener('beforeunload', bye);
        return () => {
          clearInterval(beat);
          window.removeEventListener('beforeunload', bye);
        };
      }, [roomRef, me.id, me.name, me.pet, me.mood, me.points, me.focusUntil, me.sleeping]);

      /* ---------- เก็บกวาด event เก่า (best-effort) ---------- */
      useEffect(() => {
        if (!roomRef) return;
        const sweep = () => {
          roomRef.collection('events').where('ts', '<', Date.now() - EVENT_TTL_MS).limit(20).get()
            .then((snap) => snap.forEach((d) => d.ref.delete().catch(() => {})))
            .catch(() => {});
        };
        const t = setInterval(sweep, EVENT_TTL_MS);
        sweep();
        return () => clearInterval(t);
      }, [roomRef]);

      /* ---------- เก็บกวาดรูปเก่าในแชทอัตโนมัติ (best-effort, เก็บตัวหนังสือไว้เสมอ) ---------- */
      useEffect(() => {
        if (!roomRef) return;
        const sweepImages = () => {
          roomRef.collection('messages').where('ts', '<', Date.now() - IMAGE_TTL_MS).limit(20).get()
            .then((snap) => snap.forEach((d) => {
              const data = d.data();
              if (!data.image) return;
              if (data.text) {
                d.ref.update({ image: firebase.firestore.FieldValue.delete(), imageRemoved: true }).catch(() => {});
              } else {
                d.ref.delete().catch(() => {});
              }
            }))
            .catch(() => {});
        };
        const t = setInterval(sweepImages, IMAGE_SWEEP_INTERVAL_MS);
        sweepImages();
        return () => clearInterval(t);
      }, [roomRef]);

      /* ---------- actions ---------- */
      const emit = useCallback((type, payload) => {
        if (!roomRef) return;
        const { id, name, pet } = meRef.current;
        roomRef.collection('events').add({
          type, payload: payload || null, ts: Date.now(), from: { id, name, pet }
        }).catch((e) => console.warn('emit failed:', e));
      }, [roomRef]);

      const api = useMemo(() => ({
        addTask: (task) => roomRef && roomRef.collection('tasks').doc(task.id).set(task),
        updateTask: (id, patch) => roomRef && roomRef.collection('tasks').doc(id).update(patch),
        deleteTask: (id) => roomRef && roomRef.collection('tasks').doc(id).delete(),
        sendChat: (msg) => roomRef && roomRef.collection('messages').doc(msg.id).set(msg),
        setMessageImportant: (id, important) => roomRef && roomRef.collection('messages').doc(id).update({ important }),
        deleteMessage: (id) => roomRef && roomRef.collection('messages').doc(id).delete(),
        setTheme: (themeId) => roomRef && roomRef.collection('meta').doc('state').set({ themeId, ts: Date.now() }),
        setCategories: (list) => roomRef && roomRef.collection('meta').doc('categories').set({ list, ts: Date.now() }),
        addHouseExp: (n) => roomRef && roomRef.collection('meta').doc('house').set({
          total: firebase.firestore.FieldValue.increment(n), ts: Date.now()
        }, { merge: true }),
        removeMe: (id) => roomRef && roomRef.collection('members').doc(id).delete()
      }), [roomRef]);

      return { status, allMembers, tasks, messages, roomTheme, roomCategories, houseTotal, emit, api };
    }

       UI ชิ้นเล็ก
       ============================================================ */

                      onClick={() => (locked ? onLockedTheme(t) : onTheme(t.id))}
                      title={locked ? t.name + ' — ปลดล็อกที่ Lv.' + t.unlockLevel : t.name}
                      className={'rounded-lg px-2 py-1 text-[10px] transition-all ' + (isCurrent
                        ? t.swatch + ' text-white font-medium'
                        : locked ? 'text-slate-300' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      {locked && '🔒'}{t.shortName}
                    </button>
                  );
                })}
              </div>

              <button
                onClick={onLeave}
                title="ออกจากห้อง"
                className="rounded-xl border border-white/25 bg-white/10 hover:bg-white/20 px-2.5 py-2 text-sm transition-colors"
              >
                🚪
              </button>
            </div>
          </div>
        </header>
      );
    }

    /* ============================================================
       ซ้าย: งานในมือของแต่ละคน
       ============================================================ */

    function WorkloadPanel({ me, members, tasks }) {
      const roster = useMemo(() => {
        const list = Object.values(members);
        list.sort((a, b) => a.name.localeCompare(b.name, 'th'));
        return [me, ...list];
      }, [me, members]);

      const activeCount = (id) => tasks.filter((t) => !t.done && t.ownerId === id).length;

      return (
        <Panel
          title="งานในมือของแต่ละคน"
          emoji="📊"
          badge="เรียลไทม์"
          badgeClass="bg-emerald-100 text-emerald-700"
        >
          <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
            {roster.map((m) => {
              const pet = PETS_CONFIG[m.pet] || PETS_CONFIG.dog;
              const n = activeCount(m.id);
              const free = clamp(1 - n / WORKLOAD_CAPACITY, 0, 1) * 100;
              const busy = n >= WORKLOAD_CAPACITY;
              return (
                <div key={m.id} className={'rounded-xl border p-2.5 animate-scaleUp ' +
                  (m.id === me.id ? 'border-slate-300 bg-slate-50' : 'border-slate-200 bg-white')}>
                  <div className="flex items-center gap-2">
                    <span className="text-xl shrink-0">{pet.emoji}</span>
                    <span className="text-sm font-semibold text-slate-700 truncate min-w-0">{m.name}</span>
                    {m.focusUntil && m.focusUntil > Date.now() && (
                      <span className="text-[9px] rounded-full bg-indigo-100 text-indigo-700 px-1.5 py-0.5 shrink-0">🕐 โฟกัส</span>
                    )}
                    <span className={'ml-auto text-[11px] shrink-0 ' + (busy ? 'text-rose-600 font-medium' : 'text-slate-500')}>
                      {n === 0 ? '👍 ว่างงาน' : 'ทำอยู่ ' + n + ' งาน'}
                    </span>
                  </div>
                  <div className="mt-1.5 h-1.5 rounded-full bg-slate-200 overflow-hidden">
                    <div
                      className={'h-full rounded-full transition-all duration-500 ' +
                        (free > 60 ? 'bg-emerald-500' : free > 20 ? 'bg-amber-500' : 'bg-rose-500')}
                      style={{ width: free + '%' }}
                    ></div>
                  </div>
                  {m.mood && (
                    <div className={'mt-2 text-[10px] rounded-lg border px-2 py-1 ' + pet.bubbleColor}>
                      {m.mood.emoji} {m.mood.text}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <p className="text-[10px] text-slate-400 mt-2">แถบสีคือความว่าง — เต็มมือที่ {WORKLOAD_CAPACITY} งานค้าง</p>
        </Panel>
      );
    }

    /* ============================================================
       ซ้าย: เลือกประเภทงาน
       ============================================================ */

    function CategoryPanel({ theme, tasks, selected, onSelect, categories, onAdd, onRename, onDelete }) {
      const [managing, setManaging] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState('');
      const [newEmoji, setNewEmoji] = useState('🗂');
      const [newName, setNewName] = useState('');
      const countOf = (id) => tasks.filter((t) => !t.done && t.category === id).length;

      const startEdit = (c) => { setEditingId(c.id); setEditName(c.name); };
      const submitEdit = (e) => {
        e.preventDefault();
        const n = editName.trim();
        if (n) onRename(editingId, n);
        setEditingId(null);
      };
      const submitAdd = (e) => {
        e.preventDefault();
        const n = newName.trim();
        if (!n) return;
        onAdd(n, (newEmoji.trim() || '🗂').slice(0, 4));
        setNewName('');
        setNewEmoji('🗂');
      };

      return (
        <Panel
          title="เลือกประเภทงาน"
          emoji="🗂"
          badge={categories.length + ' ส่วน'}
          right={
            <button
              type="button"
              onClick={() => { setManaging((v) => !v); setEditingId(null); }}
              className="text-[11px] rounded-full px-2.5 py-1 bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors"
            >
              {managing ? '✓ เสร็จแล้ว' : '⚙️ จัดการ'}
            </button>
          }
        >
          <div className="space-y-2">
            {categories.map((c) => {
              const n = countOf(c.id);
              const active = selected === c.id;
              const base = 'w-full flex items-center gap-2.5 rounded-xl px-3.5 py-2.5 text-sm transition-all border';
              let cls;
              if (active) cls = theme.primaryButton + ' text-white border-transparent shadow-md scale-[1.02] font-semibold';
              else if (c.urgent) cls = 'bg-rose-50 text-rose-700 border-rose-200 border-dashed hover:bg-rose-100';
              else cls = 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50';

              if (managing && !c.urgent && editingId === c.id) {
                return (
                  <form key={c.id} onSubmit={submitEdit} className="flex items-center gap-1.5">
                    <span className="text-base shrink-0">{c.emoji}</span>
                    <input
                      value={editName}
                      onChange={(e) => setEditName(e.target.value)}
                      maxLength={20}
                      autoFocus
                      className="flex-1 min-w-0 rounded-lg border border-slate-300 px-2 py-1.5 text-sm outline-none focus:ring-2 focus:ring-slate-300"
                    />
                    <button type="submit" title="บันทึก" className="shrink-0 text-xs px-2 py-1.5 rounded-lg bg-emerald-500 text-white">✓</button>
                    <button type="button" onClick={() => setEditingId(null)} title="ยกเลิก" className="shrink-0 text-xs px-2 py-1.5 rounded-lg bg-slate-200 text-slate-600">✕</button>
                  </form>
                );
              }

              return (
                <div key={c.id} className={base + ' ' + cls}>
                  <button type="button" onClick={() => onSelect(c.id)} className="flex items-center gap-2.5 flex-1 min-w-0 text-left">
                    <span className="text-base">{c.emoji}</span>
                    <span className="truncate">{c.name}</span>
                  </button>
                  {!managing && (
                    <span className={'ml-auto shrink-0 text-xs rounded-full w-6 h-6 flex items-center justify-center ' +
                      (active ? 'bg-white/25' : c.urgent ? 'bg-rose-100' : 'bg-slate-100')}>
                      {n}
                    </span>
                  )}
                  {managing && !c.urgent && (
                    <div className="ml-auto flex items-center gap-1 shrink-0">
                      <button type="button" onClick={() => startEdit(c)} title="แก้ชื่อ" className="text-xs px-1.5 py-1 rounded-lg hover:bg-black/5">✏️</button>
                      <button type="button" onClick={() => onDelete(c.id)} title="ลบหมวดนี้" className="text-xs px-1.5 py-1 rounded-lg hover:bg-black/5">🗑</button>
                    </div>
                  )}
                  {managing && c.urgent && (
                    <span className="ml-auto shrink-0 text-[9px] text-rose-400">ตายตัว</span>
                  )}
                </div>
              );
            })}

            {managing && (
              <form onSubmit={submitAdd} className="flex items-center gap-1.5 pt-1">
                <input
                  value={newEmoji}
                  onChange={(e) => setNewEmoji(e.target.value)}
                  maxLength={4}
                  className="w-11 shrink-0 rounded-lg border border-slate-200 bg-slate-50 px-2 py-1.5 text-sm text-center outline-none focus:ring-2 focus:ring-slate-300"
                />
                <input
                  value={newName}
                  onChange={(e) => setNewName(e.target.value)}
                  maxLength={20}
                  placeholder="ชื่อหมวดใหม่..."
                  className="flex-1 min-w-0 rounded-lg border border-slate-200 bg-slate-50 px-2 py-1.5 text-sm outline-none focus:ring-2 focus:ring-slate-300 placeholder:text-slate-400"
                />
                <button
                  type="submit"
                  disabled={!newName.trim()}
                  className={'shrink-0 text-xs px-2.5 py-1.5 rounded-lg text-white font-semibold disabled:opacity-40 disabled:cursor-not-allowed ' + theme.primaryButton}
                >
                  + เพิ่ม
                </button>
              </form>
            )}
          </div>
        </Panel>
      );
    }

    /* ============================================================
       ซ้าย: สร้างงานใหม่
       ============================================================ */

    function CreateTaskPanel({ theme, category, date, me, members, categories, onAdd }) {
      const [text, setText] = useState('');
      const [taskDate, setTaskDate] = useState(date);
      const [taskTime, setTaskTime] = useState('');
      const [description, setDescription] = useState('');
      const [points, setPoints] = useState(10);
      const [ownerId, setOwnerId] = useState(me.id);

      useEffect(() => { setTaskDate(date); }, [date]);

      const cat = categories.find((c) => c.id === category) || categories[0];
      const roster = [me, ...Object.values(members)];

      const submit = (e) => {
        e.preventDefault();
        const t = text.trim();
        if (!t) return;
        const owner = roster.find((m) => m.id === ownerId) || me;
        onAdd({
          text: t, category, date: taskDate, points, ownerId: owner.id, ownerName: owner.name,
          time: taskTime || null, description: description.trim() || null
        });
        setText('');
        setTaskTime('');
        setDescription('');

      return (
        <Panel className="pb-5">
          <h2 className="text-sm font-bold text-slate-700 mb-3">
            + สร้างงานใหม่ใน: <span className="font-black text-slate-900">{cat.emoji} {cat.name}</span>
          </h2>
          <form onSubmit={submit} className="space-y-3">
            <div>
              <label className="block text-[11px] text-slate-500 mb-1">ชื่องานของคุณ</label>
              <input
                value={text}
                onChange={(e) => setText(e.target.value)}
                maxLength={80}
                placeholder="เช่น ออกแบบ Banner ด่วนมาก!"
                className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-300 placeholder:text-slate-400"
              />
            </div>

            <div className="flex gap-2">
              <div className="flex-1">
                <label className="block text-[11px] text-slate-500 mb-1">เลือกวันที่ทำงาน</label>
                <input
                  type="date"
                  value={taskDate}
                  onChange={(e) => setTaskDate(e.target.value)}
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-300"
                />
              </div>
              <div className="w-28 shrink-0">
                <label className="block text-[11px] text-slate-500 mb-1">เวลา (ถ้ามี)</label>
                <input
                  type="time"
                  value={taskTime}
                  onChange={(e) => setTaskTime(e.target.value)}
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-300"
                />
              </div>
            </div>

            <div>
              <label className="block text-[11px] text-slate-500 mb-1">รายละเอียดเพิ่มเติม (ถ้ามี)</label>
              <textarea
                value={description}
                onChange={(e) => setDescription(e.target.value)}
                maxLength={2000}
                rows={3}
                placeholder="อธิบายงานนี้ให้ละเอียดขึ้น เช่น สเปค ลิงก์อ้างอิง ขั้นตอนที่ต้องทำ..."
                className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-300 placeholder:text-slate-400 resize-none"
              />
            </div>

            <div>
              <label className="block text-[11px] text-slate-500 mb-1">มอบงานให้</label>
              <select
                value={ownerId}
                onChange={(e) => setOwnerId(e.target.value)}
                className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-slate-300"
              >
                {roster.map((m) => (
                  <option key={m.id} value={m.id}>
                    {(PETS_CONFIG[m.pet] || PETS_CONFIG.dog).emoji} {m.name}{m.id === me.id ? ' (คุณ)' : ''}
                  </option>
                ))}
              </select>
            </div>

            <div>
              <label className="block text-[11px] text-slate-500 mb-1">แต้มที่ได้เมื่อปิดงาน</label>
              <div className="flex gap-1.5">
                {[5, 10, 20, 50].map((p) => (
                  <button
                    type="button"
                    key={p}
                    onClick={() => setPoints(p)}
                    className={'flex-1 rounded-lg py-1.5 text-xs border transition-all ' + (points === p
                      ? theme.primaryButton + ' text-white border-transparent font-semibold'
                      : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50')}
                  >
                    +{p}
                  </button>
                ))}
              </div>
            </div>

            <button
              type="submit"
              disabled={!text.trim()}
              className={'w-full rounded-xl py-2.5 text-sm font-semibold text-white disabled:opacity-40 disabled:cursor-not-allowed transition-colors focus:outline-none focus:ring-2 ' + theme.primaryButton}
            >
              เพิ่มงานเข้าปฏิทิน 🐾
            </button>
          </form>
        </Panel>
