    const TABS = [

      { id: 'tasks', label: 'กระดานงาน', emoji: '📋' },
      { id: 'chat', label: 'แชท', emoji: '💬' },

    ];

    // Public MQTT broker (WebSocket over TLS) — ทุกคนที่รู้รหัสห้องเข้าถึงข้อความได้
    const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const TOPIC_PREFIX = 'pawmate/v1/';
    const HEARTBEAT_MS = 4000;
    const MEMBER_TIMEOUT_MS = 13000;

    /* ============================================================
       SOUND — สังเคราะห์เสียงสัตว์ด้วย Web Audio API
       ============================================================ */

    let audioCtx = null;
    const getAudioContext = () => {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      if (!audioCtx) audioCtx = new Ctor();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    };

    const playSynthesizedSound = (type) => {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'dog') {
          const playBark = (offset) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now + offset);
            osc.frequency.exponentialRampToValueAtTime(320, now + offset + 0.05);
            osc.frequency.exponentialRampToValueAtTime(80, now + offset + 0.12);
            gain.gain.setValueAtTime(0.4, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.12);
            osc.start(now + offset);
            osc.stop(now + offset + 0.13);
          };
          playBark(0); playBark(0.18);

        } else if (type === 'cat') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sawtooth';
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(900, now);
          filter.Q.value = 4;
          // เสียง "เมี้ยว" — ไล่ขึ้นเร็วแล้วลากเสียงลง
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
          osc.frequency.exponentialRampToValueAtTime(430, now + 0.55);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.3, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.62);

        } else if (type === 'duck') {
          const playQuack = (offset) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
            osc.type = 'square';
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, now + offset);
            filter.Q.value = 8;
            osc.frequency.setValueAtTime(420, now + offset);
            osc.frequency.exponentialRampToValueAtTime(180, now + offset + 0.16);
            gain.gain.setValueAtTime(0.28, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.17);
            osc.start(now + offset);
            osc.stop(now + offset + 0.18);
          };
          playQuack(0); playQuack(0.22);
        }
      } catch (err) {
        // เสียงเล่นไม่ได้ ไม่ควรทำให้ทั้งแอปพัง
        console.warn('playSynthesizedSound failed:', err);
      }
    };

       HELPERS
       ============================================================ */

    const uid = () => Math.random().toString(36).slice(2, 10);

    const readStore = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (err) {
        return fallback;
      }
    };

    const writeStore = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* โควตาเต็ม — ข้ามไป */ }
    };

    const levelOf = (points) => Math.floor((points || 0) / 50) + 1;
    const levelProgress = (points) => ((points || 0) % 50) / 50 * 100;

    const timeLabel = (ts) => {
      const d = new Date(ts);
      return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

    /* ============================================================
       useRoom — เชื่อม MQTT, ดูแล presence, ส่ง/รับ event
       ============================================================ */

    function useRoom({ room, me, onMessage }) {
      const [status, setStatus] = useState('connecting'); // connecting | online | offline
      const clientRef = useRef(null);
      const meRef = useRef(me);
      const onMessageRef = useRef(onMessage);
      meRef.current = me;
      onMessageRef.current = onMessage;

      const publish = useCallback((type, payload) => {
        const client = clientRef.current;
        if (!client || !client.connected || !room) return;
        const { id, name, pet, mood, points } = meRef.current;
        const envelope = { type, payload, ts: Date.now(), from: { id, name, pet, mood, points } };
        client.publish(TOPIC_PREFIX + room, JSON.stringify(envelope));
      }, [room]);

      useEffect(() => {
        if (!room) return;
        const topic = TOPIC_PREFIX + room;
        let client;
        try {
          client = mqtt.connect(MQTT_BROKER, {
            clientId: 'pawmate_' + meRef.current.id + '_' + uid(),
            clean: true,
            reconnectPeriod: 3000,
            connectTimeout: 10000,
            keepalive: 30
          });
        } catch (err) {
          setStatus('offline');
          return;
        }
        clientRef.current = client;

        client.on('connect', () => {
          setStatus('online');
          client.subscribe(topic, { qos: 0 }, (err) => {
            if (err) setStatus('offline');
          });
          publish('hello', null);
        });
        client.on('reconnect', () => setStatus('connecting'));
        client.on('offline', () => setStatus('offline'));
        client.on('error', () => setStatus('offline'));
        client.on('message', (_topic, buf) => {
          let msg;
          try { msg = JSON.parse(buf.toString()); } catch (err) { return; }
          if (!msg || !msg.from || msg.from.id === meRef.current.id) return; // ข้าม echo ของตัวเอง
          onMessageRef.current(msg);
        });

        const beat = setInterval(() => publish('presence', null), HEARTBEAT_MS);
        const sayBye = () => publish('bye', null);
        window.addEventListener('beforeunload', sayBye);

        return () => {
          clearInterval(beat);
          window.removeEventListener('beforeunload', sayBye);
          sayBye();
          try { client.end(true); } catch (err) { /* ปิดไปแล้ว */ }
          clientRef.current = null;
        };
      }, [room, publish]);

      return { status, publish };
    }

    /* ============================================================

    function JoinScreen({ onJoin, initial }) {
      const [name, setName] = useState(initial.name || '');
      const [pet, setPet] = useState(initial.pet || 'dog');

      const submit = (e) => {
        e.preventDefault();
        const trimmedName = name.trim();
        const trimmedRoom = room.trim().toLowerCase().replace(/[^a-z0-9ก-๙-]/g, '');

        playSynthesizedSound(PETS_CONFIG[pet].sound); // ปลดล็อก AudioContext ด้วย user gesture

      return (

              <p className="text-xs text-white/60 mt-1.5">ห้องทำงานเรียลไทม์ของแก๊งสัตว์ขี้เกียจ (แต่งานเสร็จ)</p>
            </div>

            <div className="rounded-2xl border border-white/20 bg-white/10 backdrop-blur-sm p-5 space-y-5">
              <div>
                <label className="block text-sm font-medium mb-1.5">ชื่อเล่นของคุณ</label>
                <input
                  value={name}
                  onChange={(e) => setName(e.target.value)}

              </div>

              <div>
                <label className="block text-sm font-medium mb-2">เลือกร่างอวตาร</label>
                <div className="grid grid-cols-3 gap-2">
                  {Object.entries(PETS_CONFIG).map(([key, p]) => (
                    <button
                      type="button"
                      key={key}
                      onClick={() => { setPet(key); playSynthesizedSound(p.sound); }}
                      className={'rounded-xl py-3 border-2 transition-all ' + (pet === key
                        ? 'bg-white/95 border-fuchsia-400 scale-105 shadow-lg text-slate-900'
                        : 'bg-white/10 border-white/20 hover:bg-white/20')}

                      <div className="text-3xl leading-none">{p.emoji}</div>
                      <div className="text-[11px] mt-1">{p.name}</div>
                    </button>
                  ))}
                </div>

    /* ============================================================
       APP
       ============================================================ */

    function App() {
      const [session, setSession] = useState(() => readStore('pawmate.session', null));
      const [me, setMe] = useState(() => {
        const saved = readStore('pawmate.session', null);
        let id = readStore('pawmate.id', null);
        if (!id) { id = uid(); writeStore('pawmate.id', id); }
        return {
          id,
          name: saved ? saved.name : '',
          pet: saved ? saved.pet : 'dog',
          mood: null,
          points: readStore('pawmate.points', 0)
        };
      });

      const [members, setMembers] = useState({});      // id -> member (+lastSeen)
      const [tasks, setTasks] = useState([]);
      const [messages, setMessages] = useState([]);
      const [themeId, setThemeId] = useState('purple');
      const [foods, setFoods] = useState(DEFAULT_FOODS);
      const [foodResult, setFoodResult] = useState(null);
      const [spinning, setSpinning] = useState(false);
      const [tab, setTab] = useState('lobby');
      const [toasts, setToasts] = useState([]);
      const [showThemes, setShowThemes] = useState(false);

      const syncedRef = useRef(false);
      const publishRef = useRef(() => {});
      const stateRef = useRef({ tasks, messages, themeId, foods });
      stateRef.current = { tasks, messages, themeId, foods };

      const theme = THEMES_CONFIG[themeId] || THEMES_CONFIG.purple;

      const toast = useCallback((text) => {
        const id = uid();
        setToasts((prev) => [...prev.slice(-3), { id, text }]);
        setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3500);
      }, []);

      const touchMember = useCallback((from) => {
        if (!from) return;
        setMembers((prev) => ({ ...prev, [from.id]: { ...from, lastSeen: Date.now() } }));
      }, []);

      /* ---------- รับข้อความจากห้อง ---------- */
      const handleMessage = useCallback((msg) => {
        const { type, payload, from, ts } = msg;

        if (type === 'bye') {
          setMembers((prev) => {
            const next = { ...prev };
            delete next[from.id];
            return next;
          });
          toast(from.name + ' ออกจากบ้านไปแล้ว 👋');
          return;
        }

        touchMember(from);

        switch (type) {
          case 'hello': {
            toast(from.name + ' เข้าบ้านมาแล้ว ' + (PETS_CONFIG[from.pet] || PETS_CONFIG.dog).emoji);
            // ตอบ presence ให้คนใหม่เห็นเรา แล้วส่ง state ปัจจุบันให้ (หน่วงแบบสุ่มกันตอบชนกัน)
            setTimeout(() => publishRef.current('presence', null), 120);
            const s = stateRef.current;
            if (s.tasks.length > 0 || s.messages.length > 0) {
              setTimeout(() => {
                publishRef.current('sync-state', {
                  to: from.id,
                  tasks: s.tasks,
                  messages: s.messages.slice(-30),
                  themeId: s.themeId,
                  foods: s.foods
                });
              }, 300 + Math.random() * 400);
            }
            break;
          }

          case 'sync-state': {
            // รับเฉพาะรอบแรกหลังเข้าห้อง และเฉพาะที่ส่งถึงเรา
            if (syncedRef.current || (payload.to && payload.to !== me.id)) break;
            syncedRef.current = true;
            setTasks(payload.tasks || []);
            setMessages(payload.messages || []);
            if (payload.themeId && THEMES_CONFIG[payload.themeId]) setThemeId(payload.themeId);
            if (payload.foods && payload.foods.length) setFoods(payload.foods);
            break;
          }

          case 'chat':
            setMessages((prev) => [...prev.slice(-99), {
              id: payload.id, text: payload.text, fromId: from.id, name: from.name, pet: from.pet, ts
            }]);
            break;

          case 'task-add':
            setTasks((prev) => prev.some((t) => t.id === payload.task.id) ? prev : [...prev, payload.task]);
            break;

          case 'task-toggle':
            setTasks((prev) => prev.map((t) => t.id === payload.id
              ? { ...t, done: payload.done, doneById: payload.done ? from.id : null, doneByName: payload.done ? from.name : null }
              : t));
            break;

          case 'task-delete':
            setTasks((prev) => prev.filter((t) => t.id !== payload.id));
            break;

          case 'poke': {
            const pet = PETS_CONFIG[payload.pet] || PETS_CONFIG.dog;
            playSynthesizedSound(pet.sound);
            toast(from.name + ' ทัก ' + payload.targetName + ' ' + pet.emoji);
            break;
          }

          case 'theme':
            if (THEMES_CONFIG[payload.id]) {
              setThemeId(payload.id);
              toast(from.name + ' เปลี่ยนธีมเป็น ' + THEMES_CONFIG[payload.id].name);
            }
            break;

          case 'food-add':
            setFoods((prev) => prev.some((f) => f.name === payload.food.name) ? prev : [...prev, payload.food]);
            break;

          case 'food-result':
            setSpinning(true);
            setFoodResult(null);
            setTimeout(() => { setSpinning(false); setFoodResult(payload.food); }, 900);
            break;

          case 'presence':
          default:
            break;
        }
      }, [me.id, toast, touchMember]);

      const { status, publish } = useRoom({ room: session ? session.room : null, me, onMessage: handleMessage });
      publishRef.current = publish;

      /* ---------- ตัดคนที่เงียบหายไปเกินเวลา ---------- */
      useEffect(() => {
        const timer = setInterval(() => {
          const cutoff = Date.now() - MEMBER_TIMEOUT_MS;
          setMembers((prev) => {
            const next = {};
            let changed = false;
            Object.values(prev).forEach((m) => {
              if (m.lastSeen >= cutoff) next[m.id] = m; else changed = true;
            });
            return changed ? next : prev;
          });
        }, 3000);
        return () => clearInterval(timer);
      }, []);

      /* ---------- เก็บแต้มไว้ในเครื่อง ---------- */
      useEffect(() => { writeStore('pawmate.points', me.points); }, [me.points]);

      /* ---------- actions ---------- */
      const join = (data) => {
        const s = { name: data.name, pet: data.pet, room: data.room };
        writeStore('pawmate.session', s);
        setMe((prev) => ({ ...prev, name: data.name, pet: data.pet }));
        setSession(s);
        // ถ้าไม่มีใครส่ง state มาใน 3 วิ ถือว่าเราเป็นคนแรกของห้อง
        setTimeout(() => { syncedRef.current = true; }, 3000);
      };

      const leave = () => {
        publish('bye', null);
        localStorage.removeItem('pawmate.session');
        setSession(null);
        setMembers({});
        setTasks([]);
        setMessages([]);
        syncedRef.current = false;
      };

      const setMood = (mood) => {
        setMe((prev) => ({ ...prev, mood }));
        setTimeout(() => publishRef.current('presence', null), 0);
      };

      const poke = (target) => {
        const pet = PETS_CONFIG[target.pet] || PETS_CONFIG.dog;
        playSynthesizedSound(pet.sound);
        publish('poke', { targetId: target.id, targetName: target.name, pet: target.pet });
      };

      const addTask = (text, points) => {
        const task = { id: uid(), text, points, done: false, byId: me.id, byName: me.name, ts: Date.now() };
        setTasks((prev) => [...prev, task]);
        publish('task-add', { task });
      };

      const toggleTask = (task) => {
        const done = !task.done;
        setTasks((prev) => prev.map((t) => t.id === task.id
          ? { ...t, done, doneById: done ? me.id : null, doneByName: done ? me.name : null }
          : t));
        publish('task-toggle', { id: task.id, done });

        // แต้มเป็นของคนที่กดปิดงาน — คืนแต้มถ้าคนเดิมกดเปิดใหม่
        if (done) {
          setMe((prev) => ({ ...prev, points: (prev.points || 0) + task.points }));
          playSynthesizedSound(PETS_CONFIG[me.pet].sound);
          toast('เก่งมาก! +' + task.points + ' แต้ม 🎉');
        } else if (task.doneById === me.id) {
          setMe((prev) => ({ ...prev, points: Math.max(0, (prev.points || 0) - task.points) }));
        }
        setTimeout(() => publishRef.current('presence', null), 0);
      };

      const deleteTask = (task) => {
        setTasks((prev) => prev.filter((t) => t.id !== task.id));
        publish('task-delete', { id: task.id });
      };

      const sendChat = (text) => {
        const m = { id: uid(), text, fromId: me.id, name: me.name, pet: me.pet, ts: Date.now() };
        setMessages((prev) => [...prev.slice(-99), m]);
        publish('chat', { id: m.id, text });
      };

      const changeTheme = (id) => {
        setThemeId(id);
        setShowThemes(false);
        publish('theme', { id });
      };

      const addFood = (food) => {
        setFoods((prev) => prev.some((f) => f.name === food.name) ? prev : [...prev, food]);
        publish('food-add', { food });
      };

      const spinFood = () => {
        if (foods.length === 0) return;
        setSpinning(true);
        setFoodResult(null);
        setTimeout(() => {
          const picked = Object.assign({}, foods[Math.floor(Math.random() * foods.length)], { byName: me.name });
          setSpinning(false);
          setFoodResult(picked);
          playSynthesizedSound(PETS_CONFIG[me.pet].sound);
          publish('food-result', { food: picked });
        }, 900);
      };

      /* ---------- render ---------- */
      if (!session) {
        return <JoinScreen onJoin={join} initial={{ name: me.name, pet: me.pet, room: '' }} />;
      }

      const memberCount = Object.keys(members).length + 1;

      return (
        <div className={'min-h-screen ' + theme.bgClass}>
          <header className={'sticky top-0 z-30 border-b backdrop-blur-md shadow-lg ' + theme.headerClass}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
              <span className="text-2xl shrink-0">{theme.bannerEmoji}</span>
              <div className="min-w-0 flex-1">
                <h1 className="font-black leading-tight">Pawmate</h1>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-[11px] opacity-70">ห้อง {session.room} · {memberCount} ตัว</span>
                  <StatusDot status={status} />
                </div>
              </div>

              <div className="relative shrink-0">
                <button
                  onClick={() => setShowThemes((v) => !v)}
                  className="rounded-xl border border-white/25 bg-white/10 hover:bg-white/20 px-3 py-2 text-sm transition-colors"
                  title="เปลี่ยนธีม (เปลี่ยนให้ทุกคนในห้อง)"
                >
                  🎨
                </button>
                {showThemes && (
                  <div className="absolute right-0 mt-2 w-60 rounded-2xl border border-white/20 bg-slate-900/95 backdrop-blur-md p-1.5 shadow-2xl animate-scaleUp">
                    {Object.values(THEMES_CONFIG).map((t) => (
                      <button
                        key={t.id}
                        onClick={() => changeTheme(t.id)}
                        className={'w-full text-left text-xs rounded-xl px-3 py-2 transition-colors ' +
                          (t.id === themeId ? 'bg-white/20 text-white font-medium' : 'text-white/80 hover:bg-white/10')}
                      >
                        {t.name}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <button
                onClick={leave}
                className="shrink-0 rounded-xl border border-white/25 bg-white/10 hover:bg-white/20 px-3 py-2 text-sm transition-colors"
                title="ออกจากห้อง"
              >
                🚪
              </button>
            </div>
          </header>

          <div className="max-w-6xl mx-auto px-4 py-5 flex flex-col md:flex-row gap-5">
            <nav className="md:w-52 shrink-0 flex md:flex-col gap-1.5 overflow-x-auto pb-1 md:pb-0">
              {TABS.map((t) => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={'whitespace-nowrap rounded-xl px-4 py-2.5 text-sm text-left transition-all ' +
                    (tab === t.id ? theme.activeTabClass : 'border-l-4 border-transparent hover:bg-white/10 opacity-80')}
                >
                  {t.emoji} {t.label}
                </button>
              ))}
            </nav>

            <main className="flex-1 min-w-0">
              {tab === 'lobby' && <LobbyTab theme={theme} me={me} members={members} onPoke={poke} onMood={setMood} />}
              {tab === 'tasks' && <TasksTab theme={theme} tasks={tasks} onAdd={addTask} onToggle={toggleTask} onDelete={deleteTask} />}
              {tab === 'chat' && <ChatTab theme={theme} me={me} messages={messages} onSend={sendChat} />}
              {tab === 'board' && <BoardTab me={me} members={members} />}
              {tab === 'food' && <FoodTab theme={theme} foods={foods} result={foodResult} spinning={spinning} onSpin={spinFood} onAddFood={addFood} />}
            </main>
          </div>

          <footer className="max-w-6xl mx-auto px-4 pb-6 text-center">
            <p className="text-[10px] opacity-40">
              sync ผ่าน MQTT broker สาธารณะแบบไม่เข้ารหัส — อย่าใส่ข้อมูลลับ
            </p>
          </footer>

          <Toasts toasts={toasts} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
