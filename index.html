    }

    /* ============================================================
       กลาง: ปฏิทินสัปดาห์
       ============================================================ */

    function WeekStrip({ theme, anchor, selected, tasks, onSelect, onShift }) {
      const start = startOfWeek(fromISO(anchor));
      const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
      const today = toISO(new Date());

      return (
        <div className="flex items-stretch gap-2">
          <button
            onClick={() => onShift(-7)}
            className="shrink-0 rounded-xl bg-white/95 hover:bg-white px-3 text-xs font-medium text-slate-600 shadow-md transition-colors"
          >
            ◀ เลื่อนกลับ
          </button>

          <div className="flex-1 grid grid-cols-7 gap-1.5 sm:gap-2">
            {days.map((d) => {
              const iso = toISO(d);
              const active = iso === selected;
              const n = tasks.filter((t) => t.date === iso && !t.done).length;
              return (
                <button
                  key={iso}
                  onClick={() => onSelect(iso)}
                  className={'relative rounded-xl py-2.5 shadow-md transition-all ' + (active
                    ? theme.primaryButton + ' text-white scale-105 font-bold'
                    : 'bg-white/95 text-slate-600 hover:bg-white hover:scale-[1.03]')}
                >
                  <div className="text-[10px] sm:text-[11px] opacity-80">{THAI_DAYS[d.getDay()]}</div>
                  <div className="text-lg sm:text-2xl font-black leading-tight">{d.getDate()}</div>
                  {iso === today && (
                    <div className={'text-[8px] ' + (active ? 'text-white/80' : 'text-emerald-600 font-medium')}>วันนี้</div>
                  )}
                  {n > 0 && (
                    <span className={'absolute top-1 right-1 text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold ' +
                      (active ? 'bg-white/30 text-white' : 'bg-rose-500 text-white')}>
                      {n}
                    </span>
                  )}
                </button>
              );
            })}
          </div>

          <button
            onClick={() => onShift(7)}
            className="shrink-0 rounded-xl bg-white/95 hover:bg-white px-3 text-xs font-medium text-slate-600 shadow-md transition-colors"
          >
            เลื่อนต่อ ▶
          </button>
        </div>
      );
    }

    /* ============================================================
       กลาง: ปฏิทินทั้งเดือน (modal)
       ============================================================ */

    function MonthModal({ theme, anchor, selected, tasks, messages, onSelect, onClose }) {
      const [cursor, setCursor] = useState(() => {
        const d = fromISO(anchor);
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });

      const firstDay = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
      const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
      const lead = firstDay.getDay();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push(null);
      for (let i = 1; i <= daysInMonth; i++) cells.push(new Date(cursor.getFullYear(), cursor.getMonth(), i));
      const today = toISO(new Date());

      const shiftMonth = (n) => setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + n, 1));

      return (
        <div
          className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={onClose}
        >
          <div
            className="w-full max-w-2xl rounded-2xl bg-white p-5 shadow-2xl animate-scaleUp"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center gap-3 mb-4">
              <button onClick={() => shiftMonth(-1)} className="rounded-lg bg-slate-100 hover:bg-slate-200 px-3 py-1.5 text-sm transition-colors">◀</button>
              <h2 className="flex-1 text-center font-bold text-slate-700">
                {THAI_MONTHS[cursor.getMonth()]} {cursor.getFullYear()}
              </h2>
              <button onClick={() => shiftMonth(1)} className="rounded-lg bg-slate-100 hover:bg-slate-200 px-3 py-1.5 text-sm transition-colors">▶</button>
              <button onClick={onClose} className="rounded-lg bg-slate-100 hover:bg-slate-200 px-3 py-1.5 text-sm transition-colors">✕</button>
            </div>

            <div className="grid grid-cols-7 gap-1 mb-1">
              {THAI_DAYS_SHORT.map((d) => (
                <div key={d} className="text-center text-[11px] font-medium text-slate-400 py-1">{d}</div>
              ))}
            </div>

            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                if (!d) return <div key={'empty' + i}></div>;
                const iso = toISO(d);
                const active = iso === selected;
                const open = tasks.filter((t) => t.date === iso && !t.done).length;
                const done = tasks.filter((t) => t.date === iso && t.done).length;
                const msgCount = messages ? messages.filter((m) => m.pinDate === iso).length : 0;
                const important = messages ? messages.some((m) => m.pinDate === iso && m.important) : false;
                return (
                  <button
                    key={iso}
                    onClick={() => { onSelect(iso); onClose(); }}
                    title={msgCount > 0 ? msgCount + ' ข้อความปักหมุดวันนี้' : undefined}
                    className={'relative aspect-square rounded-xl text-sm transition-all flex flex-col items-center justify-center ' +
                      (active ? theme.primaryButton + ' text-white font-bold scale-105'
                        : iso === today ? 'bg-emerald-50 text-emerald-700 font-semibold hover:bg-emerald-100'
                        : 'bg-slate-50 text-slate-600 hover:bg-slate-100')}
                  >
                    {important && (
                      <span className={'absolute top-0.5 right-0.5 text-[9px] ' + (active ? '' : '')}>⭐</span>
                    )}
                    <span>{d.getDate()}</span>
                    {(open > 0 || done > 0 || msgCount > 0) && (
                      <span className="flex gap-0.5 mt-0.5">
                        {open > 0 && <span className={'w-1.5 h-1.5 rounded-full ' + (active ? 'bg-white' : 'bg-rose-500')}></span>}
                        {done > 0 && <span className={'w-1.5 h-1.5 rounded-full ' + (active ? 'bg-white/60' : 'bg-emerald-500')}></span>}
                        {msgCount > 0 && <span className={'w-1.5 h-1.5 rounded-full ' + (active ? 'bg-white/80' : 'bg-sky-500')}></span>}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>

            <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 mt-4 text-[11px] text-slate-400">
              <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span> มีงานค้าง</span>
              <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> มีงานที่เสร็จแล้ว</span>
              <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-sky-500"></span> มีข้อความปักหมุด</span>
              <span className="flex items-center gap-1">⭐ มีข้อความสำคัญ</span>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       กลาง: รายการงานประจำวัน
       ============================================================ */

    function DayTaskList({ theme, date, tasks, me, categories, selectedTaskId, onPick, onToggle, onDelete, onEdit }) {
      const [editingId, setEditingId] = useState(null);
      const [editText, setEditText] = useState('');
      const [editCategory, setEditCategory] = useState('');
      const [editDate, setEditDate] = useState('');
      const [editTime, setEditTime] = useState('');
      const [editDescription, setEditDescription] = useState('');

      // งานที่มีเวลาให้เรียงตามเวลาก่อนหลัง ส่วนที่ไม่ระบุเวลาให้ต่อท้ายไว้
      const list = tasks
        .filter((t) => t.date === date)
        .slice()
        .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

      const startEdit = (t) => {
        setEditingId(t.id);
        setEditText(t.text);
        setEditCategory(t.category);
        setEditDate(t.date);
        setEditTime(t.time || '');
        setEditDescription(t.description || '');
      };

      const submitEdit = (e) => {
        e.preventDefault();
        const text = editText.trim();
        if (!text || !editDate) return;
        onEdit(editingId, { text, category: editCategory, date: editDate, time: editTime || null, description: editDescription.trim() || null });
        setEditingId(null);
      };

      return (
        <Panel
          title={'รายชื่อภารกิจประจำวัน (' + date + ')'}
          emoji="📝"
          badge={'ทั้งหมด ' + list.length + ' รายการ'}
          badgeClass={'font-bold ' + (list.length ? 'bg-slate-100 text-slate-600' : 'bg-slate-100 text-slate-400')}
          className="min-h-[240px]"
        >
          {list.length === 0 ? (
            <EmptyState
              emoji="🐾"
              title="ยังไม่มีงานในวันที่เลือก"
              hint="สร้างงานใหม่ที่กล่องสร้างงานทางด้านซ้ายได้เลย!"
            />
          ) : (
            <div className="space-y-2">
              {list.map((t) => {
                const cat = categories.find((c) => c.id === t.category) || categories[0];
                const owner = t.ownerName || t.byName;

                if (editingId === t.id) {
                  return (
                    <form
                      key={t.id}
                      onSubmit={submitEdit}
                      className="rounded-xl border-2 border-slate-300 bg-slate-50 px-3 py-2.5 space-y-1.5 animate-scaleUp"
                    >
                      <input
                        value={editText}
                        onChange={(e) => setEditText(e.target.value)}
                        maxLength={80}
                        autoFocus
                        className="w-full rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-sm outline-none focus:ring-2 focus:ring-slate-300"
                      />
                      <select
                        value={editCategory}
                        onChange={(e) => setEditCategory(e.target.value)}
                        className="w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-xs outline-none focus:ring-2 focus:ring-slate-300"
                      >
                        {categories.map((c) => (
                          <option key={c.id} value={c.id}>{c.emoji} {c.name}</option>
                        ))}
                      </select>
                      <div className="flex gap-1.5">
                        <input
                          type="date"
                          value={editDate}
                          onChange={(e) => setEditDate(e.target.value)}
                          title="ย้ายงานนี้ไปวันอื่น"
                          className="flex-1 min-w-0 rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-xs outline-none focus:ring-2 focus:ring-slate-300"
                        />
                        <input
                          type="time"
                          value={editTime}
                          onChange={(e) => setEditTime(e.target.value)}
                          className="w-24 shrink-0 rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-xs outline-none focus:ring-2 focus:ring-slate-300"
                        />
                      </div>
                      <textarea
                        value={editDescription}
                        onChange={(e) => setEditDescription(e.target.value)}
                        maxLength={2000}
                        rows={2}
                        placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"
                        className="w-full rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-xs outline-none focus:ring-2 focus:ring-slate-300 placeholder:text-slate-400 resize-none"
                      />
                      <div className="flex gap-1.5 pt-0.5">
                        <button type="submit" className="flex-1 rounded-lg py-1.5 text-xs font-semibold text-white bg-emerald-500 hover:bg-emerald-600">
                          ✓ บันทึก
                        </button>
                        <button type="button" onClick={() => setEditingId(null)} className="flex-1 rounded-lg py-1.5 text-xs font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300">
                          ยกเลิก
                        </button>
                      </div>
                    </form>
                  );
                }

                return (
                  <div
                    key={t.id}
                    onClick={() => onPick(t.id)}
                    className={'flex items-center gap-3 rounded-xl border px-3 py-2.5 cursor-pointer transition-all animate-scaleUp ' +
                      (selectedTaskId === t.id ? 'border-slate-400 bg-slate-50 shadow-sm' : 'border-slate-200 bg-white hover:bg-slate-50')}
                  >
                    <button
                      onClick={(e) => { e.stopPropagation(); onToggle(t); }}
                      className={'w-6 h-6 shrink-0 rounded-lg border-2 flex items-center justify-center text-xs transition-all ' +
                        (t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-slate-500')}
                    >
                      {t.done ? '✓' : ''}
                    </button>

                    <div className="min-w-0 flex-1">
                      <div className={'text-sm font-medium truncate ' + (t.done ? 'line-through text-slate-400' : 'text-slate-700')}>
                        {t.time && <span className="text-slate-400 font-normal">{t.time} · </span>}{t.text}
                      </div>
                      <div className="text-[11px] text-slate-400 truncate">
                        {cat.emoji} {cat.name} · +{t.points} แต้ม · ของ {owner}
                        {t.done && t.doneByName ? ' · เสร็จโดย ' + t.doneByName : ''}
                      </div>
                    </div>

                    {t.category === 'urgent' && !t.done && (
                      <span className="shrink-0 text-[9px] rounded-full bg-rose-100 text-rose-600 px-2 py-0.5 font-medium">ด่วน</span>
                    )}

                    <button
                      onClick={(e) => { e.stopPropagation(); startEdit(t); }}
                      className="shrink-0 text-xs text-slate-300 hover:text-slate-600 px-1 transition-colors"
                      title="แก้ไขงานนี้"
                    >
                      ✏️
                    </button>

                    <button
                      onClick={(e) => { e.stopPropagation(); onDelete(t); }}
                      className="shrink-0 text-xs text-slate-300 hover:text-rose-500 px-1 transition-colors"
                      title="ลบงานนี้"
                    >
                      ✕
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </Panel>
      );
    }

    /* ============================================================
       กลาง: สนามวิ่งเล่นของสัตว์เลี้ยง
       ============================================================ */

    const IDLE_LINES = [
      'วันนี้งานเยอะไหม? เดี๋ยวช่วยเชียร์! 📣',
      'เดินเล่นรอบสนามครบ 3 รอบแล้ว! 🏃',
      'อย่าลืมดื่มน้ำด้วยนะ 💧',
      'พักสายตาบ้างก็ดีนะ 👀',
      'เก่งมากที่ยังสู้อยู่! 💪'
    ];

    function YardPet({ member, isMe, onClick }) {
      const pet = PETS_CONFIG[member.pet] || PETS_CONFIG.dog;
      const full = typeof member.fullness === 'number' ? member.fullness : 100;
      const asleep = !!member.sleeping;
      const focusing = member.focusUntil && member.focusUntil > Date.now();

      // ตัวที่ไม่ได้หลับให้เดินไปมาในสนาม — สุ่มจังหวะจาก id กันเดินพร้อมกันทุกตัว
      const roamStyle = asleep ? undefined : {
        animation: 'scaleUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0s 1 normal forwards, ' +
          'roam ' + seededRange(member.id, 5, 9) + 's ease-in-out -' + seededRange(member.id, 0, 8) + 's infinite normal none'
      };

      return (
        <div className={'flex flex-col items-center gap-1' + (asleep ? ' animate-scaleUp' : '')} style={roamStyle}>
          <button
            onClick={onClick}
            title={isMe
              ? (asleep ? 'คลิกเพื่อปลุกตัวเอง' : 'คลิกเพื่อเล่นด้วย')
              : 'ทัก ' + member.name}
            className={'relative transition-transform active:scale-90 hover:scale-110 ' +
              (isMe ? 'text-6xl sm:text-7xl' : 'text-4xl sm:text-5xl')}
          >
            <span className={asleep ? 'opacity-70' : ''}>{pet.emoji}</span>
            {asleep && (
              <>
                <span className="absolute -top-1 right-0 text-sm animate-zzz">z</span>
                <span className="absolute -top-1 right-2 text-xs animate-zzz" style={{ animationDelay: '0.8s' }}>z</span>
              </>
            )}
            {focusing && (
              <span className="absolute -top-1 -left-2 text-sm" title="กำลังโฟกัส">🔕</span>
            )}
            {member.mood && (
              <span className="absolute -bottom-1 -right-1 text-base" title={member.mood.text}>{member.mood.emoji}</span>
            )}
          </button>

          <div className={'text-[10px] font-medium truncate max-w-[72px] text-center ' +
            (isMe ? 'text-emerald-900 font-bold' : 'text-emerald-800/70')}>
            {member.name}{isMe ? ' (คุณ)' : ''}
          </div>

          <div className="w-14 h-1 rounded-full bg-white/70 overflow-hidden">
            <div
              className={'h-full rounded-full transition-all duration-700 ' +
                (full > 60 ? 'bg-emerald-500' : full > 25 ? 'bg-amber-500' : 'bg-rose-500')}
              style={{ width: full + '%' }}
            ></div>
          </div>
        </div>
      );
    }

    function PetYard({ me, members, fullness, sleeping, message, houseLevel, onWake, onFeed, onPinch, onPokeOther }) {
      // ย่อเป็นการ์ดเล็กไว้ก่อน กันไม่ให้บ้านสัตว์แย่งพื้นที่งานประจำวัน/แชท — กดเพื่อกางออกเต็ม
      const [open, setOpen] = useState(false);

      // เอาค่า fullness/sleeping ของตัวเองจาก state ตรง ๆ จะได้เห็นผลทันทีไม่ต้องรอ heartbeat
      const roster = useMemo(() => {
        const others = Object.values(members);
        others.sort((a, b) => a.name.localeCompare(b.name, 'th'));
        return [{ ...me, fullness, sleeping }, ...others];
      }, [me, members, fullness, sleeping]);

      if (!open) {
        return (
          <section
            onClick={() => setOpen(true)}
            className="rounded-2xl bg-gradient-to-b from-sky-50 to-emerald-100 border-2 border-emerald-200 shadow-lg px-4 py-2.5 flex items-center gap-3 cursor-pointer hover:shadow-xl transition-shadow animate-fadeIn"
          >
            <span className="text-xl shrink-0">🏡</span>
            <div className="min-w-0 flex-1">
              <div className="text-xs font-bold text-emerald-900 truncate">สนามวิ่งเล่นและกิจกรรมของทีม ({roster.length} ตัว)</div>
              <div className="flex items-center gap-1 mt-0.5 min-w-0">
                <div className="flex items-center gap-1 shrink-0">
                  {roster.slice(0, 8).map((m) => (
                    <span key={m.id} className="text-sm">{(PETS_CONFIG[m.pet] || PETS_CONFIG.dog).emoji}</span>
                  ))}
                </div>
                {/* min-w-0 จำเป็นสำหรับ truncate ในลูกของ flex — ไม่งั้นข้อความยาวจะดันการ์ดล้นจอมือถือ */}
                {message && <span className="text-[10px] text-emerald-700 truncate min-w-0 ml-1">💬 {message}</span>}
              </div>
            </div>
            <span className="shrink-0 text-[10px] font-medium text-emerald-700 bg-white/70 rounded-full px-2.5 py-1">▾ กางออก</span>
          </section>
        );
      }

      return (
        <section className="rounded-2xl bg-gradient-to-b from-sky-50 to-emerald-100 border-2 border-emerald-200 shadow-lg p-4 relative overflow-hidden">
          <div className="flex items-start justify-between gap-3 flex-wrap relative z-10">
            <div className="min-w-0">
              <h2 className="text-sm font-bold text-emerald-900 flex items-center gap-1.5">
                <span>🏡</span>
                <span className="truncate">สนามวิ่งเล่นและกิจกรรมของทีม ({roster.length} ตัว)</span>
              </h2>
              {message && (
                <div className="mt-2 inline-block rounded-2xl bg-white border-2 border-emerald-300 px-3.5 py-1.5 text-xs text-emerald-900 shadow-sm animate-scaleUp max-w-md">
                  {message}
                </div>
              )}
            </div>

            <div className="flex gap-2 shrink-0">
              <button
                onClick={onFeed}
                disabled={fullness >= 100}
                className={'rounded-xl px-3.5 py-2 text-xs font-semibold shadow-md transition-colors '
                  + (fullness >= 100
                    ? 'bg-amber-200 text-amber-500 cursor-not-allowed'
                    : 'bg-amber-400 hover:bg-amber-500 text-amber-950')}
              >
                🍖 ให้อาหาร{fullness >= 100 ? ' (อิ่มแล้ว)' : ''}
              </button>
              <button
                onClick={onPinch}
                className="rounded-xl bg-rose-400 hover:bg-rose-500 text-white px-3.5 py-2 text-xs font-semibold shadow-md transition-colors"
              >
                🤏 หยิกแก้ม
              </button>
              <button
                onClick={() => setOpen(false)}
                title="ย่อเก็บ"
                className="rounded-xl bg-white/80 hover:bg-white text-emerald-700 px-2.5 py-2 text-xs font-semibold shadow-md transition-colors"
              >
                ▴ ย่อ
              </button>
            </div>
          </div>

          {/* สนาม — ทุกตัวในห้อง */}
          <div className="relative py-5">
            <span className="absolute left-4 bottom-2 text-lg opacity-50">🌼</span>
            <span className="absolute right-6 bottom-3 text-lg opacity-50">🌷</span>
            <span className="absolute left-1/4 top-0 text-sm opacity-40">☁️</span>
            <span className="absolute right-1/3 top-1 text-xs opacity-30">☁️</span>
            {/* บ้านเล็ก ๆ ของทีม — หน้าตาเปลี่ยนไปตามเลเวลบ้าน (ปลดล็อกจาก EXP รวมของทีม)
                วางไว้มุมซ้ายให้พ้นแถวสัตว์ที่อยู่กึ่งกลาง ไม่งั้นโดนป้ายชื่อ/แถบความอิ่มบังจนมองไม่เห็น */}
            <span className="absolute left-1 bottom-0 text-5xl sm:text-6xl opacity-70 select-none pointer-events-none">
              {houseEmojiFor(houseLevel)}
            </span>

            <div className="flex items-end justify-center gap-4 sm:gap-6 flex-wrap relative z-10 min-h-[110px]">
              {roster.map((m) => (
                <YardPet
                  key={m.id}
                  member={m}
                  isMe={m.id === me.id}
                  onClick={() => (m.id === me.id ? onWake() : onPokeOther(m))}
                />
              ))}
            </div>
          </div>

          {/* แถบความอิ่มของตัวเอง */}
          <div className="relative z-10">
            <div className="flex items-center justify-between text-[10px] text-emerald-800 mb-1">
              <span>ความอิ่มของคุณ</span>
              <span className="font-bold">{Math.round(fullness)}%</span>
            </div>
            <div className="h-3 rounded-full bg-white/70 overflow-hidden shadow-inner">
              <div
                className={'h-full rounded-full transition-all duration-700 ' +
                  (fullness > 60 ? 'bg-gradient-to-r from-emerald-400 to-green-500'
                    : fullness > 25 ? 'bg-gradient-to-r from-amber-400 to-orange-500'
                    : 'bg-gradient-to-r from-rose-400 to-red-500')}
                style={{ width: fullness + '%' }}
              ></div>
            </div>
            <p className="text-[10px] text-emerald-700/60 mt-1">
              คลิกตัวเพื่อนเพื่อทัก — เสียงจะดังทุกเครื่องในห้อง · ความอิ่มของคนอื่นอัปเดตทุก {HEARTBEAT_MS / 1000} วิ
            </p>
          </div>
        </section>
      );
    }

    /* ============================================================
       ขวา: งานประจำวันที่เลือก
       ============================================================ */

    function TaskDetailPanel({ theme, task, categories, onToggle }) {
      if (!task) {
        return (
          <Panel title="งานประจำวัน" emoji="📋" badge="อัปเดตสด" badgeClass="bg-emerald-100 text-emerald-700">
            <EmptyState
              emoji="📭"
              title="ไม่มีงานที่กำลังเลือก"
              hint="สลับวันหรือสร้างงานใหม่ ๆ ในแผนกต่าง ๆ"
            />
          </Panel>
        );
      }

      const cat = categories.find((c) => c.id === task.category) || categories[0];
      return (
        <Panel title="งานประจำวัน" emoji="📋" badge="อัปเดตสด" badgeClass="bg-emerald-100 text-emerald-700">
          <div className="rounded-xl border border-slate-200 bg-slate-50 p-3.5 animate-scaleUp">
            <div className="flex items-center gap-1.5 flex-wrap mb-2">
              <span className="text-[10px] rounded-full bg-white border border-slate-200 px-2 py-0.5 text-slate-500">
                {cat.emoji} {cat.name}
              </span>
              <span className="text-[10px] rounded-full bg-white border border-slate-200 px-2 py-0.5 text-slate-500">
                📅 {task.date}{task.time ? ' · 🕐 ' + task.time : ''}
              </span>
              <span className={'text-[10px] rounded-full px-2 py-0.5 font-medium ' +
                (task.done ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700')}>
                {task.done ? '✅ เสร็จแล้ว' : '⏳ ยังไม่เสร็จ'}
              </span>
            </div>

            <p className={'text-sm font-semibold ' + (task.done ? 'line-through text-slate-400' : 'text-slate-800')}>
              {task.text}
            </p>

            {task.description && (
              <p className="mt-1.5 text-xs text-slate-600 whitespace-pre-wrap break-words">
                {task.description}
              </p>
            )}

            <dl className="mt-3 space-y-1 text-[11px] text-slate-500">
              <div className="flex gap-2"><dt className="w-16 shrink-0">เจ้าของ</dt><dd className="font-medium text-slate-700">{task.ownerName || task.byName}</dd></div>
              <div className="flex gap-2"><dt className="w-16 shrink-0">สร้างโดย</dt><dd className="font-medium text-slate-700">{task.byName}</dd></div>
              <div className="flex gap-2"><dt className="w-16 shrink-0">แต้ม</dt><dd className="font-medium text-slate-700">+{task.points}</dd></div>
              {task.done && task.doneByName && (
                <div className="flex gap-2"><dt className="w-16 shrink-0">ปิดโดย</dt><dd className="font-medium text-emerald-700">{task.doneByName}</dd></div>
              )}
            </dl>

            <button
              onClick={() => onToggle(task)}
              className={'mt-3 w-full rounded-xl py-2 text-xs font-semibold text-white transition-colors focus:outline-none focus:ring-2 ' +
                (task.done ? 'bg-slate-400 hover:bg-slate-500 focus:ring-slate-300' : theme.primaryButton)}
            >
              {task.done ? '↩︎ เปิดงานนี้ใหม่' : '✓ ปิดงานนี้ รับ +' + task.points + ' แต้ม'}
            </button>
          </div>
        </Panel>
      );
    }

    /* ============================================================
       ขวา: คลังไฟล์และลิงก์ของวันนี้
       ============================================================ */

    function LinkVaultPanel({ date, messages, onViewImage }) {
      const { images, links } = useMemo(() => {
        const imgs = [];
        const lks = [];
        messages.filter((m) => m.pinDate === date).forEach((m) => {
          if (m.image) imgs.push({ src: m.image, name: m.name, ts: m.ts, id: m.id, caption: m.text });
          extractLinks(m.text).forEach((url) => {
            lks.push({ url, name: m.name, pet: m.pet, ts: m.ts, id: m.id + url });
          });
        });
        return { images: imgs, links: lks };
      }, [date, messages]);

      const empty = images.length === 0 && links.length === 0;

      return (
        <Panel
          title="คลังไฟล์และลิงก์ของวันนี้"
          emoji="🗃"
          badge="ดึงข้อมูลอัตโนมัติจากแชท 🔄"
          badgeClass="bg-emerald-100 text-emerald-700"
        >
          {empty ? (
            <EmptyState
              emoji="🔗"
              title="ยังไม่มีรูปภาพหรือลิงก์ที่แชร์ของวันนี้"
              hint="💡 ลองแนบรูปด้วยปุ่ม 📎 หรือพิมพ์ลิงก์ในแชทดูสิ!"
            />
          ) : (
            <div className="space-y-3 max-h-72 overflow-y-auto pr-1">
              {images.length > 0 && (
                <div>
                  <div className="text-[10px] text-slate-400 mb-1.5">🖼 รูปภาพ ({images.length})</div>
                  <div className="grid grid-cols-3 gap-1.5">
                    {images.map((im) => (
                      <button
                        key={im.id}
                        type="button"
                        onClick={() => onViewImage(im)}
                        title={(im.caption ? im.caption + ' — ' : '') + 'โดย ' + im.name + ' ' + timeLabel(im.ts)}
                        className="block aspect-square rounded-lg overflow-hidden border border-slate-200 hover:opacity-80 transition-opacity animate-scaleUp"
                      >
                        <img src={im.src} alt={im.caption || 'รูปโดย ' + im.name} loading="lazy" className="w-full h-full object-cover" />
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {links.length > 0 && (
                <div>
                  <div className="text-[10px] text-slate-400 mb-1.5">🔗 ลิงก์ ({links.length})</div>
                  <div className="space-y-2">
                    {links.map((l) => (
                      <a
                        key={l.id}
                        href={l.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="block rounded-xl border border-amber-200 bg-amber-50 p-2.5 hover:bg-amber-100 transition-colors animate-scaleUp"
                      >
                        <div className="text-[10px] text-amber-700 flex items-center gap-1">
                          <span>🔗</span>
                          <span className="truncate">แชร์โดย {l.name} · {timeLabel(l.ts)}</span>
                        </div>
                        <div className="text-xs font-medium text-amber-900 underline break-all mt-0.5">
                          {shortUrl(l.url)}
                        </div>
                      </a>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </Panel>
      );
    }

    /* ============================================================
       ขวา: แชทอัปเดตกลุ่ม
       ============================================================ */

    function ChatPanel({ theme, me, messages, pinDate, onSend, onToggleImportant, onDelete, onError, onViewImage }) {
      const [text, setText] = useState('');
      const [pendingImage, setPendingImage] = useState(null);
      const [busy, setBusy] = useState(false);
      const [query, setQuery] = useState('');
      const [importantOnly, setImportantOnly] = useState(false);
      const endRef = useRef(null);
      const fileRef = useRef(null);

      useEffect(() => {
        if (endRef.current) endRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, [messages.length]);

      const q = query.trim().toLowerCase();
      const shown = messages.filter((m) => {
        if (importantOnly && !m.important) return false;
        if (q && !((m.text || '').toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q))) return false;
        return true;
      });
      const filtering = !!q || importantOnly;

      const pickFile = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';           // เลือกไฟล์เดิมซ้ำได้
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          onError('แนบได้เฉพาะรูปภาพ (คลิปวิดีโอใหญ่เกินกว่าจะเก็บใน Firestore)');
          return;
        }
        setBusy(true);
        compressImage(file)
          .then(setPendingImage)
          .catch((err) => onError(err.message))
          .finally(() => setBusy(false));
      };

      const submit = (e) => {
        e.preventDefault();
        const t = text.trim();
        if (!t && !pendingImage) return;
        onSend(t, pendingImage);
        setText('');
        setPendingImage(null);
      };

      return (
        <Panel title="แชทอัปเดตกลุ่ม" emoji="🐾" badge={'📌 ' + pinDate} badgeClass="bg-rose-100 text-rose-600">
          <div className="flex gap-1.5 mb-2">
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="🔎 ค้นข้อความ (100 อันล่าสุด)..."
              className="flex-1 min-w-0 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-slate-300 placeholder:text-slate-400"
            />
            <button
              type="button"
              onClick={() => setImportantOnly((v) => !v)}
              title="โชว์เฉพาะข้อความสำคัญ"
              className={'shrink-0 rounded-xl border px-2.5 py-1.5 text-xs transition-colors ' +
                (importantOnly ? 'bg-amber-100 border-amber-300 text-amber-700' : 'border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-500')}
            >
              ⭐
            </button>
          </div>

          <div className="space-y-3 max-h-[26rem] overflow-y-auto pr-1">
            {messages.length === 0 && (
              <EmptyState emoji="💬" title="ยังไม่มีใครพูดอะไร" hint="เริ่มทักก่อนเลย!" />
            )}
            {messages.length > 0 && shown.length === 0 && (
              <EmptyState emoji="🔎" title="ไม่พบข้อความที่ตรงกัน" hint="ลองเปลี่ยนคำค้นหรือปิดตัวกรองดู" />
            )}
            {shown.map((m) => {
              const pet = PETS_CONFIG[m.pet] || PETS_CONFIG.dog;
              const links = extractLinks(m.text);
              return (
                <div key={m.id} className={'animate-scaleUp rounded-2xl -mx-1 px-1 py-0.5 ' + (m.important ? 'bg-amber-50/70 ring-1 ring-amber-200' : '')}>
                  <div className="flex items-center gap-1.5 flex-wrap mb-1">
                    <span className="text-base">{pet.emoji}</span>
                    <span className="text-[11px] font-semibold text-slate-600">{m.name}</span>
                    <span className="text-[10px] text-slate-400">({pet.name})</span>
                    {m.pinDate && (
                      <span className="text-[9px] rounded-full bg-rose-50 text-rose-500 px-1.5 py-0.5">
                        📌 ปักหมุดวันที่ {m.pinDate}
                      </span>
                    )}
                    <span className="text-[9px] text-slate-300 ml-auto">{timeLabel(m.ts)}</span>
                    <button
                      onClick={() => onToggleImportant(m)}
                      title={m.important ? 'เอาออกจากข้อความสำคัญ' : 'ติ๊กเป็นข้อความสำคัญ'}
                      className={'shrink-0 text-xs px-1 transition-colors ' + (m.important ? 'text-amber-500' : 'text-slate-300 hover:text-amber-400')}
                    >
                      {m.important ? '⭐' : '☆'}
                    </button>
                    {m.fromId === me.id && (
                      <button
                        onClick={() => onDelete(m)}
                        title="ลบข้อความนี้"
                        className="shrink-0 text-xs text-slate-300 hover:text-rose-500 px-1 transition-colors"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  {m.text && (
                    <div className={'rounded-2xl border px-3 py-2 text-xs break-words ' +
                      (m.fromId === me.id ? 'bg-slate-100 border-slate-200 text-slate-700' : pet.bubbleColor)}>
                      {m.text}
                    </div>
                  )}

                  {m.image && (
                    <button
                      type="button"
                      onClick={() => onViewImage({ src: m.image, caption: m.text, name: m.name })}
                      className="block mt-1"
                    >
                      <img
                        src={m.image}
                        alt={'รูปที่ ' + m.name + ' แชร์'}
                        loading="lazy"
                        className="rounded-xl border border-slate-200 max-h-52 w-auto hover:opacity-90 transition-opacity"
                      />
                    </button>
                  )}

                  {!m.image && m.imageRemoved && (
                    <div className="text-[10px] text-slate-400 mt-1">🗑 รูปถูกลบอัตโนมัติ (เก็บไว้เกิน 3 อาทิตย์)</div>
                  )}

                  {links.map((url) => (
                    <a
                      key={url}
                      href={url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="mt-1 block rounded-xl border border-amber-200 bg-amber-50 px-2.5 py-1.5 hover:bg-amber-100 transition-colors"
                    >
                      <div className="text-[9px] text-amber-700">🔗 แชร์ลิงก์ด่วน</div>
                      <div className="text-[11px] text-amber-900 underline break-all">{shortUrl(url)}</div>
                    </a>
                  ))}
                </div>
              );
            })}
            {!filtering && <div ref={endRef}></div>}
          </div>

          {pendingImage && (
            <div className="mt-3 relative inline-block animate-scaleUp">
              <img src={pendingImage} alt="รูปที่กำลังจะส่ง" className="rounded-xl border-2 border-slate-300 max-h-28" />
              <button
                onClick={() => setPendingImage(null)}
                title="เอารูปออก"
                className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-slate-900 text-white text-xs shadow-lg hover:bg-rose-600 transition-colors"
              >
                ✕
              </button>
              <div className="text-[10px] text-slate-400 mt-1">
                ย่อแล้ว ~{Math.round(pendingImage.length / 1024)} KB
              </div>
            </div>
          )}

          <form onSubmit={submit} className="mt-3 flex gap-1.5">
            <input ref={fileRef} type="file" accept="image/*" onChange={pickFile} className="hidden" />
            <button
              type="button"
              onClick={() => fileRef.current && fileRef.current.click()}
              disabled={busy}
              title="แนบรูปภาพ"
              className="shrink-0 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 disabled:opacity-40 px-2.5 py-2 text-sm transition-colors"
            >
              {busy ? '⏳' : '📎'}
            </button>
            <input
              value={text}
              onChange={(e) => setText(e.target.value)}
              maxLength={200}
              placeholder={pendingImage ? 'ใส่คำบรรยายรูป (ไม่ใส่ก็ได้)...' : 'พิมพ์ข้อความหรือวางลิงก์...'}
              className="flex-1 min-w-0 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-slate-300 placeholder:text-slate-400"
            />
            <button
              type="submit"
              disabled={(!text.trim() && !pendingImage) || busy}
              className={'shrink-0 rounded-xl px-3.5 py-2 text-xs font-semibold text-white disabled:opacity-40 transition-colors focus:outline-none focus:ring-2 ' + theme.primaryButton}
            >
              ส่ง
            </button>
          </form>
          <p className="text-[10px] text-slate-400 mt-1.5">
            ปักหมุดที่วันที่ {pinDate} · รูปและลิงก์จะเข้าคลังอัตโนมัติ · รูปถูกย่อเหลือ {IMAGE_MAX_DIM}px
          </p>
        </Panel>
      );
    }

    /* ============================================================
       ปุ่มลอย: Focus Time
       ============================================================ */

    const FOCUS_DURATION_OPTIONS = [15, 25, 45, 60];

    function FocusButton({ theme, focusUntil, minutes, onStart, onStop }) {
      const [now, setNow] = useState(Date.now());
      const [pickerOpen, setPickerOpen] = useState(false);

      useEffect(() => {
        if (!focusUntil) return;
        const t = setInterval(() => setNow(Date.now()), 500);
        return () => clearInterval(t);
      }, [focusUntil]);

      const running = focusUntil && focusUntil > now;
      const left = running ? Math.max(0, focusUntil - now) : 0;
      const mm = String(Math.floor(left / 60000)).padStart(2, '0');
      const ss = String(Math.floor((left % 60000) / 1000)).padStart(2, '0');

      if (running) {
        return (
          <button
            onClick={onStop}
            className="fixed bottom-5 right-5 z-40 rounded-full px-6 py-3.5 font-bold text-white shadow-2xl transition-all hover:scale-105 active:scale-95 flex items-center gap-2 bg-gradient-to-r from-rose-500 to-red-600"
          >
            <span className="animate-pulse">🕐</span>
            <span>โฟกัสอยู่ {mm}:{ss} — กดเพื่อหยุด</span>
          </button>
        );
      }

      return (
        <div className="fixed bottom-5 right-5 z-40">
          {pickerOpen && (
            <div className="absolute bottom-full right-0 mb-2 w-44 rounded-xl bg-white shadow-2xl border border-slate-200 p-2">
              <div className="text-[11px] font-bold text-slate-500 mb-1.5 px-1">เลือกเวลาโฟกัส</div>
              <div className="grid grid-cols-2 gap-1">
                {FOCUS_DURATION_OPTIONS.map((m) => (
                  <button
                    key={m}
                    type="button"
                    onClick={() => { setPickerOpen(false); onStart(m); }}
                    className="rounded-lg px-2 py-1.5 text-xs font-semibold bg-slate-50 hover:bg-slate-100 text-slate-700 transition-colors"
                  >
                    {m} นาที
                  </button>
                ))}
              </div>
            </div>
          )}
          <button
            onClick={() => setPickerOpen((v) => !v)}
            className={'rounded-full px-6 py-3.5 font-bold text-white shadow-2xl transition-all hover:scale-105 active:scale-95 flex items-center gap-2 ' + theme.primaryButton}
          >
            <span>🕐</span>
            <span>Focus Time ({minutes} นาที) ▾</span>
          </button>
        </div>
      );
    }

    /* ============================================================
       APP
       ============================================================ */

    function App() {
      const { uid: authUid, error: authError } = useAuth();

      const [session, setSession] = useState(() => readStore('pawmate.session', null));
      const [me, setMe] = useState(() => {
        const saved = readStore('pawmate.session', null);
        return {
          id: null,                       // ได้จาก Firebase anonymous auth
          name: saved ? saved.name : '',
          pet: saved ? saved.pet : 'dog',
          mood: null,
          points: readStore('pawmate.points', 0),
          focusUntil: null
        };
      });

      // uid จาก auth คือตัวตนของเรา และเป็น doc id ใน rooms/{room}/members
      useEffect(() => {
        if (authUid) setMe((prev) => (prev.id === authUid ? prev : { ...prev, id: authUid }));
      }, [authUid]);

      // ปลดล็อก AudioContext ด้วย user gesture แรกที่เจอ — สำคัญสำหรับคนที่ session
      // ถูกจำไว้แล้ว (ข้าม JoinScreen) เพราะ browser จะไม่ยอมเล่นเสียงที่เริ่มจาก
      // event แบบ async (เช่นเสียงแจ้งเตือนจากคนอื่นที่มาผ่าน Firestore listener)
      // จนกว่าจะมี gesture จริงของผู้ใช้เกิดขึ้นในหน้านี้ก่อน
      useEffect(() => {
        const unlock = () => { getAudioContext(); };
        document.addEventListener('pointerdown', unlock, { once: true });
        document.addEventListener('keydown', unlock, { once: true });
        return () => {
          document.removeEventListener('pointerdown', unlock);
          document.removeEventListener('keydown', unlock);
        };
      }, []);

      const [themeId, setThemeId] = useState('purple');
      const [toasts, setToasts] = useState([]);

      const [selectedDate, setSelectedDate] = useState(() => toISO(new Date()));
      const [weekAnchor, setWeekAnchor] = useState(() => toISO(new Date()));
      const [category, setCategory] = useState('urgent');
      const [selectedTaskId, setSelectedTaskId] = useState(null);
      const [showMonth, setShowMonth] = useState(false);
      const [viewerImage, setViewerImage] = useState(null);

      const [fullness, setFullness] = useState(() => readStore('pawmate.fullness', 70));
      const [focusMinutes, setFocusMinutes] = useState(() => readStore('pawmate.focusMinutes', FOCUS_MINUTES));
      const [petMsg, setPetMsg] = useState('');
      const [lastPoke, setLastPoke] = useState(() => Date.now());
      const [tick, setTick] = useState(0);   // เดินเวลาให้สัตว์เลี้ยงหลับ + ตัดคนที่หายไปเอง

      const theme = THEMES_CONFIG[themeId] || THEMES_CONFIG.purple;

      const toast = useCallback((text) => {
        const id = uid();
        setToasts((prev) => [...prev.slice(-3), { id, text }]);
        setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3500);
      }, []);

      // เขียนลง Firestore ไม่สำเร็จต้องรู้ตัว ไม่ใช่เงียบหาย
      const guard = useCallback((p, what) => {
        if (p && p.catch) p.catch((e) => {
          console.error(what + ' failed:', e);
          toast('บันทึกไม่สำเร็จ (' + what + ') — ' + (e.code || e.message));
        });
      }, [toast]);

      /* ---------- event ชั่วคราว: ทัก / โฟกัส / เข้า-ออกห้อง ----------
         งาน แชท ธีม สมาชิก ไม่ต้องมาทางนี้แล้ว — Firestore snapshot ส่งให้เอง */
      const handleEvent = useCallback((ev) => {
        const { type, payload, from } = ev;
        switch (type) {
          case 'hello':
            toast(from.name + ' เข้าบ้านมาแล้ว ' + (PETS_CONFIG[from.pet] || PETS_CONFIG.dog).emoji);
            break;
          case 'bye':
            toast(from.name + ' ออกจากบ้านไปแล้ว 👋');
            break;
          case 'poke': {
            const pet = PETS_CONFIG[payload.pet] || PETS_CONFIG.dog;
            playSynthesizedSound(pet.sound);
            toast(from.name + ' ' + payload.action + ' ' + pet.emoji);
            break;
          }
          case 'theme':
            if (THEMES_CONFIG[payload.id]) {
              toast(from.name + ' เปลี่ยนธีมเป็น ' + THEMES_CONFIG[payload.id].name);
            }
            break;
          case 'focus':
            toast(payload.on
              ? from.name + ' เข้าโหมด Focus Time — อย่าเพิ่งกวนนะ 🕐'
              : from.name + ' ออกจากโหมดโฟกัสแล้ว ✨');
            break;
          case 'craving':
            playSynthesizedSound((PETS_CONFIG[from.pet] || PETS_CONFIG.dog).sound);
            toast(from.name + ': ' + payload.emoji + ' ' + payload.text);
            break;
          case 'mood':
            playSynthesizedSound((PETS_CONFIG[from.pet] || PETS_CONFIG.dog).sound);
            toast(from.name + ' ' + payload.emoji + ' ' + payload.text);
            break;
          default:
            break;
        }
      }, [toast]);

      // sleeping/fullness ต้องไปกับ presence ด้วย เพื่อนถึงจะเห็นว่าเราหลับอยู่หรือหิว
      const sleeping = tick >= 0 && !me.focusUntil && Date.now() - lastPoke > 45000;
      const meWithPet = useMemo(
        () => ({ ...me, fullness, sleeping }),
        [me, fullness, sleeping]
      );

      const { status, allMembers, tasks, messages, roomTheme, roomCategories, houseTotal, emit, api } = useRoom({
        room: session ? session.room : null,
        me: meWithPet,
        ready: !!authUid,
        onEvent: handleEvent
      });

      // ธีมของห้องมาจาก Firestore — ใครเปลี่ยนก็เปลี่ยนพร้อมกันทุกเครื่อง
      // ต้องเช็ค unlockLevel ตอนโหลดด้วย ไม่งั้นถ้าห้องเคยถูกตั้งธีมพิเศษไว้ตอนที่ยังไม่ล็อก (หรือแก้ข้อมูลตรงๆ)
      // แล้วค่อยมาล็อกทีหลัง ธีมนั้นจะยังโผล่มาทุกครั้งที่รีเฟรชโดยไม่เช็คเลเวลเลย
      useEffect(() => {
        if (!roomTheme) return;
        const t = THEMES_CONFIG[roomTheme];
        if (!t) return;
        const level = Math.floor(houseTotal / HOUSE_EXP_PER_LEVEL) + 1;
        if (t.unlockLevel && level < t.unlockLevel) return;
        setThemeId(roomTheme);
      }, [roomTheme, houseTotal]);

      // ประเภทงาน (นอกจาก "งานด่วน" ที่ตายตัว) แก้ไขได้เอง — ยังไม่มีใน Firestore ก็ใช้ค่าเริ่มต้นไปก่อน
      const editableCategories = roomCategories && roomCategories.length ? roomCategories : DEFAULT_CATEGORIES;
      const categories = useMemo(
        () => [URGENT_CATEGORY, ...editableCategories],
        [editableCategories]
      );

      /* ---------- สมาชิกคนอื่นที่ยังไม่หายไป ----------
         Firestore ไม่มี onDisconnect เหมือน RTDB ถ้าใครปิดแท็บดื้อ ๆ doc จะค้าง
         เลยกรองด้วย lastSeen เอง (tick ทำให้คำนวณใหม่ทุก 5 วิ) */
      const members = useMemo(() => {
        const cutoff = Date.now() - MEMBER_TIMEOUT_MS;
        const out = {};
        Object.values(allMembers).forEach((m) => {
          if (m.id !== me.id && (m.lastSeen || 0) >= cutoff) out[m.id] = m;
        });
        return out;
      }, [allMembers, me.id, tick]);

      /* ---------- เก็บค่าไว้ในเครื่อง ---------- */
      useEffect(() => { writeStore('pawmate.points', me.points); }, [me.points]);
      useEffect(() => { writeStore('pawmate.fullness', fullness); }, [fullness]);

      /* ---------- สัตว์เลี้ยงหิวลงเรื่อย ๆ ---------- */
      useEffect(() => {
        const t = setInterval(() => setFullness((f) => clamp(f - 1, 0, 100)), 15000);
        return () => clearInterval(t);
      }, []);

      /* ---------- นาฬิกาเดินทุก 5 วิ ให้สถานะหลับ/ตื่นอัปเดตเอง ---------- */
      useEffect(() => {
        const t = setInterval(() => setTick((n) => n + 1), 5000);
        return () => clearInterval(t);
      }, []);

      /* ---------- Focus Time หมดเวลา ---------- */
      useEffect(() => {
        if (!me.focusUntil) return;
        const left = me.focusUntil - Date.now();
        if (left <= 0) return;
        const t = setTimeout(() => {
          playSynthesizedSound('chime');
          toast('หมดเวลาโฟกัสแล้ว! พักสายตาหน่อยนะ 🎉');
          setMe((prev) => ({ ...prev, focusUntil: null }));
          emit('focus', { on: false });
        }, left);
        return () => clearTimeout(t);
      }, [me.focusUntil, toast, emit]);

      /* ---------- เสียงเมื่อมีข้อความแชทใหม่จากเพื่อน — เฉพาะข้อความที่มาหลังเปิดแอป ไม่เล่นย้อนหลังตอนโหลดครั้งแรก ---------- */
      const chatSeenRef = useRef(new Set());
      const chatMountedAt = useRef(Date.now());
      useEffect(() => {
        messages.forEach((m) => {
          if (chatSeenRef.current.has(m.id)) return;
          chatSeenRef.current.add(m.id);
          if (m.ts > chatMountedAt.current && m.fromId !== me.id) {
            playSynthesizedSound('chime');
            toast(m.name + ': ' + (m.text || '📷 ส่งรูปมาให้'));
          }
        });
      }, [messages]);

      /* ---------- เสียงเตือนงานที่มีเวลา — เตือนล่วงหน้า 10 นาที + ตอนถึงเวลาจริง ----------
         ทำงานได้เฉพาะตอนเปิดแท็บนี้ค้างไว้เท่านั้น (ไม่มี push notification ตอนปิดแท็บ)
         เก็บ id งานที่เตือนไปแล้วไว้กันเตือนซ้ำทุกครั้งที่เช็ค
         อ่านจาก tasksRef เสมอ ไม่ใส่ tasks ใน deps ตรงๆ กันไม่ให้ interval รีสตาร์ททุกครั้งที่งานเปลี่ยน
         (ไม่งั้นตัวจับเวลา 30 นาทีของตัวเตือนงานค้างด้านล่างจะถูกรีเซ็ตอยู่ตลอด แทบไม่มีโอกาสได้ครบรอบ) */
      const tasksRef = useRef(tasks);
      tasksRef.current = tasks;
      const notifiedRef = useRef(new Set());
      useEffect(() => {
        const check = () => {
          const now = Date.now();
          const today = toISO(new Date());
          tasksRef.current.forEach((t) => {
            if (t.done || t.date !== today || !t.time) return;
            const due = new Date(t.date + 'T' + t.time).getTime();
            const soonKey = t.id + ':soon';
            const dueKey = t.id + ':due';
            if (now >= due - 10 * 60000 && now < due && !notifiedRef.current.has(soonKey)) {
              notifiedRef.current.add(soonKey);
              playSynthesizedSound('alert');
              toast('⏰ อีก 10 นาทีถึงเวลา "' + t.text + '" แล้วนะ');
            }
            if (now >= due && !notifiedRef.current.has(dueKey)) {
              notifiedRef.current.add(dueKey);
              playSynthesizedSound('alert');
              toast('⏰ ถึงเวลาทำ "' + t.text + '" แล้ว!');
            }
          });
        };
        const t = setInterval(check, 20000);
        check();
        return () => clearInterval(t);
      }, []);

      /* ---------- เตือนซ้ำเป็นระยะว่ายังมีงานค้างของวันนี้ — ทุก 30 นาทีตลอดที่เปิดแท็บไว้ ---------- */
      useEffect(() => {
        const t = setInterval(() => {
          const today = toISO(new Date());
          const pending = tasksRef.current.filter((task) => task.date === today && !task.done).length;
          if (pending > 0) {
            playSynthesizedSound('chime');
            toast('📋 วันนี้ยังมีงานค้างอยู่ ' + pending + ' ชิ้นนะ อย่าลืมทำ!');
          }
        }, 30 * 60000);
        return () => clearInterval(t);
      }, []);

      /* ---------- ข้อมูลที่คำนวณ ---------- */
      const houseLevel = Math.floor(houseTotal / HOUSE_EXP_PER_LEVEL) + 1;
      const houseExp = houseTotal % HOUSE_EXP_PER_LEVEL;

      const selectedTask = useMemo(
        () => tasks.find((t) => t.id === selectedTaskId) || null,
        [tasks, selectedTaskId]
      );

      /* ---------- actions ---------- */
      const join = (data) => {
        const s = { name: data.name, pet: data.pet, room: data.room };
        writeStore('pawmate.session', s);
        setMe((prev) => ({ ...prev, name: data.name, pet: data.pet }));
        setSession(s);
        setTimeout(() => emit('hello', null), 800);   // รอให้ listener ติดก่อนค่อยทัก
      };

      const leave = () => {
        emit('bye', null);
        if (me.id) api.removeMe(me.id);
        localStorage.removeItem('pawmate.session');
        setSession(null);
      };

      const renameMe = (name) => {
        setMe((prev) => ({ ...prev, name }));   // presence effect เขียนลง Firestore ให้เอง
        const s = { ...session, name };
        writeStore('pawmate.session', s);
        setSession(s);
      };

      // ติ๊กอารมณ์ = ทั้งติดป้ายอารมณ์ค้างไว้ที่ตัวเอง และกระจายเสียง+toast ให้ทุกคนในห้องเห็นทันที
      // กดซ้ำอารมณ์เดิมก็ยังส่งกระจายใหม่ได้เรื่อยๆ (สแปมได้)
      const setMood = (mood) => {
        setMe((prev) => ({ ...prev, mood }));
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
        emit('mood', { emoji: mood.emoji, text: mood.text });
      };

      const changePet = (pet) => {
        setMe((prev) => ({ ...prev, pet }));   // presence effect เขียนลง Firestore ให้เอง
        const s = { ...session, pet };
        writeStore('pawmate.session', s);
        setSession(s);
        playSynthesizedSound(PETS_CONFIG[pet].sound);
      };

      const addTask = ({ text, category, date, points, ownerId, ownerName, time, description }) => {
        const task = {
          id: uid(), text, category, date, points, done: false,
          byId: me.id, byName: me.name, ownerId, ownerName,
          doneById: null, doneByName: null, ts: Date.now()
        };
        if (time) task.time = time;               // ไม่มีเวลาก็อย่าใส่ field เปล่า rules จะได้ตรวจง่าย
        if (description) task.description = description;
        guard(api.addTask(task), 'เพิ่มงาน');
        setSelectedTaskId(task.id);
        setSelectedDate(date);
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
      };

      const editTask = (id, { text, category, date, time, description }) => {
        guard(api.updateTask(id, {
          text, category, date,
          time: time || firebase.firestore.FieldValue.delete(),
          description: description || firebase.firestore.FieldValue.delete()
        }), 'แก้ไขงาน');
        if (date && date !== selectedDate) {
          setSelectedDate(date);
          setWeekAnchor(date);
          toast('ย้ายงานไปวันที่ ' + date + ' แล้ว');
        }
      };

      const toggleTask = (task) => {
        const done = !task.done;
        guard(api.updateTask(task.id, {
          done,
          doneById: done ? me.id : null,
          doneByName: done ? me.name : null
        }), 'ปิดงาน');

        // แต้มเป็นของคนที่กดปิดงาน — คืนแต้มถ้าคนเดิมกดเปิดใหม่
        // EXP ของบ้านเป็นยอดสะสมถาวรแยกต่างหาก ไม่ขึ้นกับว่าใครยังออนไลน์อยู่ในห้องหรือเปล่า
        if (done) {
          setMe((prev) => ({ ...prev, points: (prev.points || 0) + task.points }));
          guard(api.addHouseExp(task.points), 'เพิ่ม EXP บ้าน');
          playSynthesizedSound(PETS_CONFIG[me.pet].sound);
          toast('เก่งมาก! +' + task.points + ' แต้ม 🎉');
          setPetMsg('เย้! ปิดงานได้อีกชิ้น เก่งที่สุดเลย! 🎉');
          setLastPoke(Date.now());
        } else if (task.doneById === me.id) {
          setMe((prev) => ({ ...prev, points: Math.max(0, (prev.points || 0) - task.points) }));
          guard(api.addHouseExp(-task.points), 'ลด EXP บ้าน');
        }
      };

      const deleteTask = (task) => {
        guard(api.deleteTask(task.id), 'ลบงาน');
        if (selectedTaskId === task.id) setSelectedTaskId(null);
      };

      const addCategory = (name, emoji) => {
        guard(api.setCategories([...editableCategories, { id: uid(), name, emoji }]), 'เพิ่มหมวดงาน');
      };

      const renameCategory = (id, name) => {
        guard(api.setCategories(editableCategories.map((c) => (c.id === id ? { ...c, name } : c))), 'แก้ชื่อหมวดงาน');
      };

      const deleteCategory = (id) => {
        if (tasks.some((t) => t.category === id)) {
          toast('ลบไม่ได้ ยังมีงานค้างอยู่ในหมวดนี้ — ย้ายหรือปิดงานก่อนนะ');
          return;
        }
        guard(api.setCategories(editableCategories.filter((c) => c.id !== id)), 'ลบหมวดงาน');
        if (category === id) setCategory('urgent');
      };

      const sendChat = (text, image) => {
        const msg = {
          id: uid(), text: text || '', pinDate: selectedDate,
          fromId: me.id, name: me.name, pet: me.pet, ts: Date.now()
        };
        if (image) msg.image = image;   // ไม่มีรูปก็อย่าใส่ field เปล่า rules จะได้ตรวจง่าย
        guard(api.sendChat(msg), image ? 'ส่งรูป' : 'ส่งข้อความ');
      };

      const toggleImportant = (msg) => {
        guard(api.setMessageImportant(msg.id, !msg.important), 'ติ๊กสำคัญ');
      };

      const deleteMessage = (msg) => {
        guard(api.deleteMessage(msg.id), 'ลบข้อความ');
      };

      const changeTheme = (id) => {
        setThemeId(id);
        guard(api.setTheme(id), 'เปลี่ยนธีม');
        emit('theme', { id });
      };

      const lockedThemeAttempt = (t) => {
        toast('🔒 ' + t.name + ' ปลดล็อกที่บ้าน Lv.' + t.unlockLevel + ' — ตอนนี้อยู่ Lv.' + houseLevel);
      };

      const wakePet = () => {
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
        setLastPoke(Date.now());
        setPetMsg(sleeping
          ? 'หวัดดี! ตื่นแล้ววว ตัวเบาโหวงเลย ✨'
          : IDLE_LINES[Math.floor(Math.random() * IDLE_LINES.length)]);
        emit('poke', { action: 'ปลุกสัตว์เลี้ยงของตัวเอง', pet: me.pet });
      };

      const feedPet = () => {
        if (fullness >= 100) {
          toast('อิ่มจนจะแตกแล้ว เดี๋ยวท้องย่อยก่อนนะ 🐽');
          return;
        }
        const food = DEFAULT_FOODS[Math.floor(Math.random() * DEFAULT_FOODS.length)];
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
        setFullness((f) => clamp(f + 20, 0, 100));
        setMe((prev) => ({ ...prev, points: (prev.points || 0) + 1 })); // ให้อาหารก็ได้ EXP ทีละ 1 ด้วย
        guard(api.addHouseExp(1), 'เพิ่ม EXP บ้าน');
        setLastPoke(Date.now());
        setPetMsg('อร่อยจัง! ' + food.emoji + ' ' + food.name + ' อิ่มขึ้นอีก 20% แล้ว (+1 EXP)');
        emit('poke', { action: 'ป้อน ' + food.name + ' ให้', pet: me.pet });
      };

      const pinchPet = () => {
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
        setLastPoke(Date.now());
        setPetMsg('โอ๊ย! เจ็บนะ 😾 หยิกแรงไปแล้ววว');
        emit('poke', { action: 'หยิกแก้ม', pet: me.pet });
      };

      const pokeOther = (m) => {
        const pet = PETS_CONFIG[m.pet] || PETS_CONFIG.dog;
        playSynthesizedSound(pet.sound);   // เสียงของ "ตัวที่ถูกทัก" ไม่ใช่ของเรา
        setLastPoke(Date.now());
        setPetMsg('ไปทัก ' + m.name + ' มาแล้ว ' + pet.emoji);
        emit('poke', { action: 'ทัก ' + m.name + ' ที่สนาม', pet: m.pet });
      };

      const sendCraving = (text, emoji) => {
        const t = text.trim();
        if (!t) return;
        playSynthesizedSound(PETS_CONFIG[me.pet].sound);
        emit('craving', { text: t, emoji: emoji || '📣' });
        toast('ส่งไปแล้ว! ' + (emoji || '📣') + ' ' + t);
      };

      const startFocus = (minutes) => {
        const mins = minutes || focusMinutes;
        setFocusMinutes(mins);
        writeStore('pawmate.focusMinutes', mins);
        const until = Date.now() + mins * 60000;
        setMe((prev) => ({ ...prev, focusUntil: until }));
        setLastPoke(Date.now());
        setPetMsg('โหมดโฟกัส! เดี๋ยวเฝ้าให้ ห้ามใครกวน 🔕');
        emit('focus', { on: true });
      };

      const stopFocus = () => {
        setMe((prev) => ({ ...prev, focusUntil: null }));
        emit('focus', { on: false });
      };

      /* ---------- ข้อความสัตว์เลี้ยงตามสถานะ ---------- */
      useEffect(() => {
        if (!petMsg) return;
        const t = setTimeout(() => setPetMsg(''), 6000);
        return () => clearTimeout(t);
      }, [petMsg]);

      const petLine = petMsg
        || (sleeping ? 'ฟี้... Zzz... 😴 (หลับปุ๋ย... คลิกที่ตัวเค้าเพื่อปลุกสิ)' : '')
        || (fullness < 25 ? 'ท้องร้องแล้วนะ... 🥺 ขออาหารหน่อยได้ไหม' : '');

      /* ---------- render ---------- */
      if (authError) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-rose-900 to-red-950 text-white flex items-center justify-center p-6">
            <div className="max-w-md text-center">
              <div className="text-6xl mb-4">🙀</div>
              <h1 className="text-xl font-black mb-2">เชื่อมต่อ Firebase ไม่ได้</h1>
              <p className="text-sm text-white/70 mb-4">{authError}</p>
              <div className="rounded-xl bg-white/10 border border-white/20 p-4 text-left text-xs leading-relaxed">
                เปิด Firebase Console → <b>Authentication</b> → <b>Sign-in method</b> → เปิด <b>Anonymous</b><br />
                แล้วรีเฟรชหน้านี้อีกครั้ง
              </div>
            </div>
          </div>
        );
      }

      if (!authUid) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-800 to-fuchsia-900 text-white flex flex-col items-center justify-center p-6">
            <span className="text-6xl animate-bounce-slow">🐶</span>
            <p className="mt-4 text-sm text-white/70">กำลังเชื่อม Firebase...</p>
          </div>
        );
      }

      if (!session) {
        return <JoinScreen onJoin={join} initial={{ name: me.name, pet: me.pet, room: '' }} />;
      }

      return (
        <div className={'relative min-h-screen pb-24 ' + theme.bgClass}>
          {theme.id === 'dragon' && <DragonScene />}
          {theme.id === 'galaxy' && <GalaxyScene />}
          {theme.id === 'cottoncandy' && <CottonCandyScene />}
          {theme.id === 'unicorn' && <UnicornScene />}
          {theme.id === 'greekgod' && <GreekGodScene />}
          {theme.id === 'ocean' && <OceanScene />}
          <Header
            theme={theme}
            me={me}
            houseLevel={houseLevel}
            houseExp={houseExp}
            status={status}
            room={session.room}
            memberCount={Object.keys(members).length + 1}
            onName={renameMe}
            onMood={setMood}
            onTheme={changeTheme}
            onLockedTheme={lockedThemeAttempt}
            onPet={changePet}
            onCraving={sendCraving}
            onLeave={leave}
          />

          {theme.id === 'dragon' && <DragonHero />}
          {theme.id === 'cottoncandy' && <CottonCandyHero />}
          {theme.id === 'unicorn' && <UnicornHero />}
          {theme.id === 'greekgod' && <GreekGodHero />}
          {theme.id === 'ocean' && <OceanHero />}
          <div className="relative z-10 max-w-[1800px] mx-auto px-3 py-4 grid gap-4 grid-cols-1 lg:grid-cols-[280px_minmax(0,1fr)] xl:grid-cols-[280px_minmax(0,1fr)_340px]">

            {/* ---------- ซ้าย ---------- */}
            <div className="space-y-4 animate-fadeIn">
              <WorkloadPanel me={me} members={members} tasks={tasks} />
              <CategoryPanel
                theme={theme}
                tasks={tasks}
                selected={category}
                onSelect={setCategory}
                categories={categories}
                onAdd={addCategory}
                onRename={renameCategory}
                onDelete={deleteCategory}
              />
              <CreateTaskPanel
                theme={theme}
                category={category}
                date={selectedDate}
                me={me}
                members={members}
                categories={categories}
                onAdd={addTask}
              />
            </div>

            {/* ---------- กลาง ---------- */}
            <div className="space-y-4 animate-fadeIn">
              <div className="flex items-end justify-between gap-3 flex-wrap">
                <div>
                  <h2 className="text-xl font-black flex items-center gap-2">
                    <span>🗓</span> แผงควบคุมและปฏิทินของทีม
                  </h2>
                  <p className="text-xs opacity-60 mt-0.5">เลือกดูหัวข้องานของแต่ละวันอย่างเป็นระบบ</p>
                </div>
                <button
                  onClick={() => setShowMonth(true)}
                  className={'rounded-xl px-4 py-2.5 text-sm font-semibold text-white shadow-lg transition-colors focus:outline-none focus:ring-2 ' + theme.primaryButton}
                >
                  📝 ดูปฏิทินทั้งเดือน
                </button>
              </div>

              <WeekStrip
                theme={theme}
                anchor={weekAnchor}
                selected={selectedDate}
                tasks={tasks}
                onSelect={setSelectedDate}
                onShift={(n) => {
                  const next = toISO(addDays(fromISO(weekAnchor), n));
                  setWeekAnchor(next);
                  setSelectedDate(next);
                }}
              />

              <DayTaskList
                theme={theme}
                date={selectedDate}
                tasks={tasks}
                me={me}
                categories={categories}
                selectedTaskId={selectedTaskId}
                onPick={setSelectedTaskId}
                onToggle={toggleTask}
                onDelete={deleteTask}
                onEdit={editTask}
              />

              <PetYard
                me={me}
                members={members}
                fullness={fullness}
                sleeping={sleeping}
                message={petLine}
                houseLevel={houseLevel}
                onWake={wakePet}
                onFeed={feedPet}
                onPinch={pinchPet}
                onPokeOther={pokeOther}
              />
            </div>

            {/* ---------- ขวา ---------- */}
            <div className="space-y-4 animate-fadeIn">
              <TaskDetailPanel theme={theme} task={selectedTask} categories={categories} onToggle={toggleTask} />
              <LinkVaultPanel date={selectedDate} messages={messages} onViewImage={setViewerImage} />
              <ChatPanel
                theme={theme}
                me={me}
                messages={messages}
                pinDate={selectedDate}
                onSend={sendChat}
                onToggleImportant={toggleImportant}
                onDelete={deleteMessage}
                onError={toast}
                onViewImage={setViewerImage}
              />
            </div>
          </div>

          {showMonth && (
            <MonthModal
              theme={theme}
              anchor={weekAnchor}
              selected={selectedDate}
              tasks={tasks}
              messages={messages}
              onSelect={(iso) => { setSelectedDate(iso); setWeekAnchor(iso); }}
              onClose={() => setShowMonth(false)}
            />
          )}

          <ImageLightbox image={viewerImage} onClose={() => setViewerImage(null)} />

          <FocusButton theme={theme} focusUntil={me.focusUntil} minutes={focusMinutes} onStart={startFocus} onStop={stopFocus} />
          <Toasts toasts={toasts} />

          <footer className="max-w-[1800px] mx-auto px-4 pb-4 text-center">
            <p className="text-[10px] opacity-40">
              ข้อมูลเก็บถาวรใน Firebase Firestore · ความเป็นส่วนตัวอยู่ที่รหัสห้อง — อย่าใส่ข้อมูลลับ
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
